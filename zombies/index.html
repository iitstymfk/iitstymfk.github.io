<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Iitsty Zombies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#eee;font-family:Oswald,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross i:nth-child(1),#cross i:nth-child(2){width:2px;height:9px;left:-1px}
#cross i:nth-child(3),#cross i:nth-child(4){height:2px;width:9px;top:-1px}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0}
#hitm:before,#hitm:after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;transform:rotate(45deg);box-shadow:0 0 3px #000}
#hitm:after{transform:rotate(-45deg)}
#hitm.kill:before,#hitm.kill:after{background:#ff3b3b}
#round{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:14px;font-family:Creepster,cursive;font-size:96px;line-height:1;color:#a30000;text-shadow:0 0 14px rgba(170,0,0,.55),3px 3px 0 #2a0000}
#round.flash{animation:rflash 3.2s ease}
@keyframes rflash{0%{color:#fff;text-shadow:0 0 30px #fff;transform:scale(1.25)}35%{color:#fff;text-shadow:0 0 22px #fff}100%{color:#a30000;transform:scale(1)}}
.tal{position:relative;display:inline-block;height:.8em}
.tal i{display:inline-block;width:.11em;height:.8em;background:currentColor;margin:0 .06em;border-radius:.04em;transform:rotate(3deg);box-shadow:inherit}
.tal i:nth-child(2){transform:rotate(-2deg) translateY(.03em)}.tal i:nth-child(3){transform:rotate(5deg)}
.tal i.sl{position:absolute;left:-.12em;top:.32em;width:1.15em;height:.1em;transform:rotate(-24deg);margin:0}
#perks{position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:118px;display:flex;gap:6px}
#perks i{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:18px;box-shadow:0 0 10px currentColor,inset 0 0 0 2px rgba(255,255,255,.25)}
#right{position:absolute;right:calc(26px + env(safe-area-inset-right));bottom:18px;text-align:right}
#pts{position:relative;font-size:40px;font-weight:700;color:#fff;text-shadow:0 2px 6px #000,0 0 2px #000;margin-bottom:6px}
#pts.no{animation:nope .4s}
@keyframes nope{0%,100%{color:#fff}30%,70%{color:#ff3030;transform:translateX(-4px)}}
#ptsPop{position:absolute;right:0;bottom:100%;width:0;height:0}
.pp{position:absolute;right:0;bottom:0;color:#ffd84a;font-weight:700;font-size:22px;text-shadow:0 2px 4px #000;animation:pp 1s ease-out forwards;white-space:nowrap}
@keyframes pp{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),-60px)}}
#gunName{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#ddd;text-shadow:0 1px 3px #000}
#gunName.up{color:#d59bff;text-shadow:0 0 8px #8a2be2}
#ammo{font-size:30px;font-weight:600;text-shadow:0 2px 5px #000}
#ammo b{font-size:38px}#ammo b.low{color:#ff4040}
#nades{font-size:14px;color:#c8d27a;letter-spacing:2px}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:6px 14px;border-radius:6px;font-size:19px;text-shadow:0 1px 2px #000;white-space:nowrap;display:none}
#prompt b{color:#ffd84a}
#ann{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:Creepster,cursive;font-size:56px;color:#7dff5a;text-shadow:0 0 18px rgba(80,255,60,.6),3px 3px 0 #000;opacity:0;white-space:nowrap;transition:opacity .4s}
#msg{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:22px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#pus{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px}
#pus i{font-style:normal;background:rgba(20,40,10,.6);border:2px solid #7dff5a;color:#c8ffb8;border-radius:10px;padding:4px 10px;font-weight:700;font-size:16px;box-shadow:0 0 12px rgba(125,255,90,.5)}
#pus i.blink{animation:blink .4s infinite}
@keyframes blink{50%{opacity:.25}}
#low{position:absolute;left:50%;top:calc(50% + 36px);transform:translateX(-50%);font-size:16px;font-weight:600;color:#ffd84a;text-shadow:0 1px 3px #000;letter-spacing:.1em}
#dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(170,0,0,.85) 100%);opacity:0}
#downV{position:absolute;inset:0;background:rgba(60,0,0,.55);backdrop-filter:grayscale(1);opacity:0;transition:opacity .4s}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 31vmin,#000 31.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000;left:50%;top:50%}
#scope:before{width:1px;height:62vmin;transform:translate(-50%,-50%)}#scope:after{height:1px;width:62vmin;transform:translate(-50%,-50%)}
#flashW{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .6s}
/* menus */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.85));overflow:auto;padding:16px}
.panel{width:min(520px,94vw);text-align:center;background:rgba(10,8,8,.72);border:1px solid rgba(160,0,0,.45);border-radius:16px;padding:22px 22px 18px;box-shadow:0 0 50px rgba(120,0,0,.35);backdrop-filter:blur(4px)}
h1{font-family:Creepster,cursive;font-weight:400;font-size:64px;line-height:.9;margin:0 0 6px;color:#c40000;text-shadow:0 0 20px rgba(200,0,0,.5),3px 3px 0 #200}
h1 span{font-size:84px;color:#e8e2d0;text-shadow:0 0 16px rgba(255,255,255,.25),3px 3px 0 #300}
.sub{opacity:.8;margin-bottom:14px;font-size:15px}
input,select{font:inherit;font-size:17px;padding:9px 12px;border-radius:10px;border:1px solid #533;background:#140e0e;color:#eee;width:100%;margin:6px 0;text-align:center}
button{font:inherit;font-size:17px;padding:9px 16px;border-radius:10px;border:1px solid #6a2a2a;background:#2a1414;color:#eee;cursor:pointer;margin:4px}
button:hover{background:#3a1a1a}
button.big{display:block;width:100%;margin:10px 0;font-size:30px;letter-spacing:.12em;padding:10px;background:linear-gradient(#a40000,#5a0000);border-color:#d33;font-weight:700;box-shadow:0 0 22px rgba(200,0,0,.45)}
.row{display:flex;justify-content:center;flex-wrap:wrap}
h3{margin:14px 0 6px;font-weight:600;letter-spacing:.1em;color:#d9c9a3}
ol.lb{list-style:none;padding:0;margin:0;text-align:left;font-size:16px;max-height:34vh;overflow:auto}
ol.lb li{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.07);align-items:baseline}
ol.lb li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb li .r{color:#ff4b4b;font-weight:700;white-space:nowrap}
ol.lb li small{opacity:.6;white-space:nowrap}
ol.lb li.me{background:rgba(200,0,0,.18);border-radius:6px}
.box{text-align:left;font-size:15px;line-height:1.5;background:rgba(255,255,255,.04);border-radius:10px;padding:10px 14px;margin:8px 0}
.box label{display:flex;justify-content:space-between;gap:10px;align-items:center}
.box input[type=range]{width:55%}
.box select{width:55%;margin:4px 0}
.stat{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:18px;margin:6px 0}
.stat b{color:#ffd84a}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;font-family:Creepster,cursive;font-size:40px;color:#a00}
#rotate{position:fixed;inset:0;z-index:40;background:#000;display:none;place-items:center;text-align:center;font-size:24px;padding:20px}
/* touch */
#touch{position:fixed;inset:0;z-index:6}
#lookZone{position:absolute;inset:0}
#joyBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.3)}
.tb{position:absolute;border-radius:50%;background:rgba(20,20,20,.45);border:2px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.05em;text-shadow:0 1px 2px #000;touch-action:none}
.tb.on{background:rgba(200,40,40,.5)}
#tFire{width:92px;height:92px;right:calc(26px + env(safe-area-inset-right));bottom:20vh;font-size:16px;border-color:rgba(255,90,90,.7)}
#tAds{width:62px;height:62px;right:calc(134px + env(safe-area-inset-right));bottom:9vh}
#tReload{width:54px;height:54px;right:calc(30px + env(safe-area-inset-right));bottom:calc(20vh + 104px)}
#tKnife{width:54px;height:54px;right:calc(100px + env(safe-area-inset-right));bottom:calc(20vh + 70px)}
#tNade{width:50px;height:50px;right:calc(130px + env(safe-area-inset-right));bottom:calc(9vh + 74px)}
#tSwap{width:54px;height:54px;right:calc(36px + env(safe-area-inset-right));bottom:6vh}
#tUse{width:78px;height:78px;right:calc(150px + env(safe-area-inset-right));bottom:calc(20vh + 150px);background:rgba(200,160,30,.45);border-color:#ffd84a;display:none}
#tPause{width:44px;height:44px;left:calc(12px + env(safe-area-inset-left));top:12px;border-radius:10px;font-size:18px}
body.touch #round{font-size:58px;left:calc(66px + env(safe-area-inset-left));top:8px;bottom:auto}
body.touch #perks{left:calc(66px + env(safe-area-inset-left));top:76px;bottom:auto}
body.touch #perks i{width:28px;height:28px;font-size:15px}
body.touch #right{top:8px;bottom:auto}
body.touch #pts{font-size:30px}body.touch #ammo{font-size:22px}body.touch #ammo b{font-size:28px}
body.touch #pus{bottom:auto;top:10px}
body.touch #prompt{top:30%;font-size:16px}
body.touch #ann{font-size:40px}
body.touch h1{font-size:46px}body.touch h1 span{font-size:60px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="cross"><i></i><i></i><i></i><i></i></div>
  <div id="hitm"></div>
  <div id="round"></div>
  <div id="perks"></div>
  <div id="right"><div id="pts"><div id="ptsPop"></div><span id="ptsN">500</span></div>
    <div id="gunName"></div><div id="ammo"><b id="mag">8</b> / <span id="res">80</span></div><div id="nades"></div></div>
  <div id="prompt"></div>
  <div id="ann"></div><div id="msg"></div>
  <div id="pus"></div>
  <div id="low"></div>
  <div id="dmg"></div><div id="downV"></div><div id="scope"></div><div id="flashW"></div>
</div>
<div id="touch" class="hidden">
  <div id="lookZone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tb" id="tFire">FIRE</div>
  <div class="tb" id="tAds">AIM</div>
  <div class="tb" id="tReload">⟳</div>
  <div class="tb" id="tKnife">🔪</div>
  <div class="tb" id="tNade">💣</div>
  <div class="tb" id="tSwap">⇄</div>
  <div class="tb" id="tUse">USE</div>
  <div class="tb" id="tPause">❚❚</div>
</div>
<div id="menu" class="ov"><div class="panel">
  <h1>IITSTY<br><span>ZOMBIES</span></h1>
  <div class="sub">Map: <b>The Bunker</b> · survive as many rounds as you can</div>
  <input id="nm" maxlength="20" placeholder="Your name for the scoreboard" autocomplete="off">
  <button id="play" class="big">PLAY</button>
  <div class="row"><button id="bSet">⚙ Settings</button><button id="bHelp">? How to play</button></div>
  <div id="settings" class="box hidden">
    <label>Look sensitivity <input id="sSens" type="range" min="0.3" max="2.5" step="0.05"></label>
    <label>Volume <input id="sVol" type="range" min="0" max="1" step="0.05"></label>
    <label>Graphics <select id="sQ"><option value="high">High</option><option value="med">Medium</option><option value="low">Low (phones)</option></select></label>
    <div style="opacity:.6;font-size:13px">Graphics changes apply when the page reloads.</div>
  </div>
  <div id="help" class="box hidden"></div>
  <h3>TOP SURVIVORS</h3>
  <ol id="lb" class="lb"><li>Loading…</li></ol>
</div></div>
<div id="pause" class="ov hidden"><div class="panel"><h1>PAUSED</h1><button id="resume" class="big">RESUME</button><button id="quit">Quit to menu</button></div></div>
<div id="over" class="ov hidden"><div class="panel">
  <h1>GAME OVER</h1>
  <div id="ovRound" style="font-size:26px"></div>
  <div id="ovStats" class="stat"></div>
  <div id="ovSave" style="opacity:.8;margin:6px 0"></div>
  <ol id="lb2" class="lb"></ol>
  <button id="again" class="big">PLAY AGAIN</button>
</div></div>
<div id="rotate">📱↻<br>Turn your phone sideways to play</div>
<div id="load">Loading…</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ================= basics ================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const escH = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k, d){ try{ const v = localStorage.getItem('iz_' + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
             set(k, v){ try{ localStorage.setItem('iz_' + k, JSON.stringify(v)); }catch{} } };
const isTouch = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window && innerWidth < 1100);
if(isTouch) document.body.classList.add('touch');
const opts = { sens: LS.get('sens', 1), vol: LS.get('vol', 0.8), quality: LS.get('quality', isTouch ? 'low' : 'high'), name: LS.get('name', '') };
const HQ = opts.quality === 'high', LQ = opts.quality === 'low';
const SB_URL = 'https://nbqifpnkdwjzvapyztqh.supabase.co', SB_KEY = 'sb_publishable_dPkzVxWoTvXLkaIYwy9xQw_X6G49pGS';
async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.message || ('error ' + r.status)); return j;
}
const KEY = isTouch ? 'USE' : 'F';
try{ await Promise.race([Promise.all(['40px Creepster', '700 40px Oswald', '600 22px Oswald'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); }catch{}
function disposeTree(o){ o.traverse(c => { if(c.geometry) c.geometry.dispose(); }); }

/* ================= renderer ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LQ, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
renderer.autoClear = false;
renderer.setPixelRatio(Math.min(devicePixelRatio, HQ ? 1.75 : LQ ? 1 : 1.3));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.FogExp2(0x06080c, 0.055);
const camera = new THREE.PerspectiveCamera(78, 1, 0.05, 140); camera.rotation.order = 'YXZ'; scene.add(camera);
const vmScene = new THREE.Scene(); const vmCam = new THREE.PerspectiveCamera(55, 1, 0.01, 10);
const vmHemi = new THREE.HemisphereLight(0xc8d0ff, 0x2a1c12, 1.1); vmScene.add(vmHemi);
const vmDir = new THREE.DirectionalLight(0xffe2b8, 1.8); vmDir.position.set(1, 2, 1.5); vmScene.add(vmDir);
const vmFlash = new THREE.PointLight(0xffb060, 0, 3, 2); vmFlash.position.set(0.15, -0.05, -0.7); vmScene.add(vmFlash);
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = vmCam.aspect = w / h; camera.updateProjectionMatrix(); vmCam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ================= textures ================= */
function ctex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if(rep) t.repeat.set(rep[0], rep[1]);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = HQ ? 8 : 2; return t;
}
function grain(x, w, h, amt){ const d = x.getImageData(0, 0, w, h); for(let i = 0; i < d.data.length; i += 4){ const n = (Math.random() - .5) * amt; d.data[i] += n; d.data[i+1] += n; d.data[i+2] += n; } x.putImageData(d, 0, 0); }
function blots(x, w, h, n, col, rmin, rmax){ for(let i = 0; i < n; i++){ x.fillStyle = col(); x.beginPath(); x.arc(Math.random()*w, Math.random()*h, rand(rmin, rmax), 0, 7); x.fill(); } }
const TEX = {};
TEX.floor = ctex(512, 512, (x, w, h) => {
  x.fillStyle = '#55524b'; x.fillRect(0, 0, w, h);
  blots(x, w, h, 70, () => `rgba(${rand(15,40)|0},${rand(12,32)|0},${rand(8,25)|0},${rand(.05,.22)})`, 10, 70);
  x.strokeStyle = 'rgba(0,0,0,.4)'; x.lineWidth = 3;
  for(let i = 0; i <= 4; i++){ x.beginPath(); x.moveTo(i*w/4, 0); x.lineTo(i*w/4, h); x.stroke(); x.beginPath(); x.moveTo(0, i*h/4); x.lineTo(w, i*h/4); x.stroke(); }
  x.strokeStyle = 'rgba(0,0,0,.55)'; x.lineWidth = 1.4;
  for(let i = 0; i < 10; i++){ let px = Math.random()*w, py = Math.random()*h; x.beginPath(); x.moveTo(px, py); for(let j = 0; j < 7; j++){ px += rand(-30,30); py += rand(-30,30); x.lineTo(px, py); } x.stroke(); }
  blots(x, w, h, 6, () => `rgba(70,8,6,${rand(.15,.35)})`, 8, 30);
  grain(x, w, h, 30);
});
TEX.brick = ctex(256, 512, (x, w, h) => {
  x.fillStyle = '#2b201c'; x.fillRect(0, 0, w, h);
  const bh = h / 16, bw = w / 3;
  for(let r = 0; r < 16; r++) for(let c = -1; c < 4; c++){
    const ox = (r % 2) * bw / 2; const v = rand(-14, 14);
    x.fillStyle = `rgb(${105+v|0},${55+v*.6|0},${42+v*.4|0})`;
    x.fillRect(c*bw + ox + 3, r*bh + 3, bw - 6, bh - 6);
  }
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,6,2,.6)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  blots(x, w, h, 18, () => `rgba(0,0,0,${rand(.08,.2)})`, 6, 40);
  grain(x, w, h, 26);
});
TEX.wood = ctex(256, 256, (x, w, h) => {
  for(let i = 0; i < 4; i++){ const v = rand(-12, 12); x.fillStyle = `rgb(${92+v|0},${62+v|0},${36+v*.5|0})`; x.fillRect(0, i*h/4, w, h/4); x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, i*h/4, w, 3); }
  x.strokeStyle = 'rgba(40,22,8,.35)'; for(let i = 0; i < 40; i++){ const y = Math.random()*h; x.beginPath(); x.moveTo(0, y); x.bezierCurveTo(w*.3, y + rand(-6,6), w*.6, y + rand(-6,6), w, y + rand(-4,4)); x.stroke(); }
  grain(x, w, h, 24);
});
TEX.crate = ctex(256, 256, (x, w, h) => {
  x.drawImage(TEX.wood.image, 0, 0);
  x.strokeStyle = '#3a2410'; x.lineWidth = 22; x.strokeRect(11, 11, w-22, h-22);
  x.lineWidth = 18; x.beginPath(); x.moveTo(20, 20); x.lineTo(w-20, h-20); x.stroke();

}

  for(const k in DOORS){ const D = DOORS[k]; if(D.open && D.mesh){ D.anim += dt; D.mesh.position.y = D.anim * D.anim * 3; if(D.anim > 1.6){ level.remove(D.mesh); D.mesh = null; } } }
  // flicker
  for(const b of BULBS){ b.flick += dt; let k = bulbBase(b); if(!power && b.room === 0 && Math.sin(b.flick * 13) * Math.sin(b.flick * 3.7) > .82) k *= .15; if(!power && b.room !== 0) k *= .6 + Math.sin(b.flick * 2) * .4; b.light.intensity = k; }
  // HUD timers
  if(annT > 0){ annT -= dt; if(annT <= 0) $('#ann').style.opacity = 0; }
  if(msgT > 0){ msgT -= dt; if(msgT <= 0) $('#msg').style.opacity = 0; }
  if(hitT > 0){ hitT -= dt; if(hitT <= 0) $('#hitm').style.opacity = 0; }
  let pus = ''; if(instaT > 0) pus += `<i class="${instaT < 5 ? 'blink' : ''}">☠ ${Math.ceil(instaT)}</i>`; if(x2T > 0) pus += `<i class="${x2T < 5 ? 'blink' : ''}">x2 ${Math.ceil(x2T)}</i>`;
  if(hudCache.pus !== pus){ $('#pus').innerHTML = pus; hudCache.pus = pus; }
  let low = ''; if(g){ const st = gs(g); if(g.mag === 0 && g.res === 0) low = 'NO AMMO'; else if(g.mag <= Math.ceil(st.mag * .25) && P.reloadT <= 0) low = g.res > 0 ? (isTouch ? 'RELOAD ⟳' : 'Press R to reload') : 'LOW AMMO'; }
  if(hudCache.low !== low){ $('#low').textContent = low; hudCache.low = low; }
  const spr = (g ? (P.ads > .6 ? W[g.k].ads : W[g.k].spread) : .02) * (P.moving > .2 ? 1.5 : 1) * 900 + 6 + P.kick * 14;
  if(Math.abs((hudCache.spr || 0) - spr) > .5){ hudCache.spr = spr; const cs = $('#cross').children; cs[0].style.top = -spr - 9 + 'px'; cs[1].style.top = spr + 'px'; cs[2].style.left = -spr - 9 + 'px'; cs[3].style.left = spr + 'px'; }
  $('#cross').style.opacity = (P.ads > .6 || P.sprint) ? 0 : 1;
  // ----- viewmodel -----
  updVM(dt);
}
function updVM(dt){
  const g = P.guns[P.gi]; const a = P.ads;
  const hip = new THREE.Vector3(.2, -.2, -.42), ads = new THREE.Vector3(0, -.105, -.3);
  const pos = hip.lerp(ads, a);
  const bobA = P.sprint ? 2.2 : 1;
  pos.x += Math.cos(P.step * .5) * .012 * P.moving * bobA * (1 - a * .8); pos.y += Math.abs(Math.sin(P.step * .5)) * .014 * P.moving * bobA * (1 - a * .8);
  pos.z += P.kick * .06;
  let rx = P.kick * .25, ry = P.sprint ? .55 : 0, rz = P.sprint ? .3 : 0;
  if(P.reloadT > 0){ const k = 1 - P.reloadT / P.reloadDur; const s = Math.sin(k * Math.PI); rx -= s * .6; pos.y -= s * .12; rz += s * .5; }
  if(P.swapT > 0){ pos.y -= P.swapT * .6; }
  if(P.drinkT > 0 || P.knifeT > 0 || P.nadeT > 0 || P.down || !g){ pos.y -= .5; }
  vmRoot.position.lerp(pos, Math.min(1, dt * 18)); vmRoot.rotation.x += (rx - vmRoot.rotation.x) * Math.min(1, dt * 14); vmRoot.rotation.y += (ry - vmRoot.rotation.y) * Math.min(1, dt * 10); vmRoot.rotation.z += (rz - vmRoot.rotation.z) * Math.min(1, dt * 10);
  vmGunHolder.visible = !!g && !(g && W[g.k].scope && a > .9);
  // muzzle flash
  if(muzzleT > 0 && curModel){ const mp = curModel.userData.muzzle.clone(); curModel.localToWorld(mp); muzzleSprite.position.copy(mp); muzzleSprite.visible = true; muzzleSprite.material.rotation = Math.random() * 6; muzzleSprite.scale.setScalar(rand(.12, .2) * (g && W[g.k].model === 'shotgun' ? 1.5 : 1)); muzzleSprite.material.color.set(g && g.up ? 0xc070ff : (g && W[g.k].proj ? 0x60ff60 : 0xffc070)); vmFlash.intensity = 4; }
  else { muzzleSprite.visible = false; vmFlash.intensity = 0; }
  // knife & grenade
  knife.visible = P.knifeT > 0;
  if(P.knifeT > 0){ const k = 1 - P.knifeT / .5; knife.position.set(.3 - k * .5, -.15 + Math.sin(k * Math.PI) * .06, -.35 - Math.sin(k * Math.PI) * .12); knife.rotation.set(-.2, .9 - k * 1.8, -.3); }
  nadeVM.visible = P.nadeT > 0; if(P.nadeT > 0){ const k = 1 - P.nadeT / .55; nadeVM.position.set(.18, -.16 + k * .1, -.35 - k * .3); }
  // drink bottle (reuse grenade model tinted by perk color)
  vmHemi.intensity = power ? 1.25 : 1.0;
}

/* ================= render loop ================= */
let last = performance.now(), menuT = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if(G_STATE === 'play'){ now += dt; update(dt); }
  else if(G_STATE === 'menu'){ menuT += dt * .12; camera.position.set(7 * CELL + Math.sin(menuT) * 3, 1.7, 16 * CELL + Math.cos(menuT) * 2); camera.rotation.set(-.05, menuT * 1.4 + Math.PI, 0);
    for(const b of BULBS){ b.flick += dt; let k = bulbBase(b); if(b.room === 0 && Math.sin(b.flick * 13) * Math.sin(b.flick * 3.7) > .82) k *= .15; b.light.intensity = k; } updBox(dt); }
  else if(G_STATE === 'over'){ updFX(dt); updZombies(dt); camera.rotation.z = .25; }
  renderer.clear(); renderer.render(scene, camera);
  if(G_STATE === 'play' || G_STATE === 'pause'){ renderer.clearDepth(); renderer.render(vmScene, vmCam); }
}

/* ================= menu ================= */
$('#nm').value = opts.name;
$('#sSens').value = opts.sens; $('#sVol').value = opts.vol; $('#sQ').value = opts.quality;
$('#sSens').oninput = e => { opts.sens = +e.target.value; LS.set('sens', opts.sens); };
$('#sVol').oninput = e => { opts.vol = +e.target.value; LS.set('vol', opts.vol); if(MG) MG.gain.value = opts.vol; };
$('#sQ').onchange = e => { opts.quality = e.target.value; LS.set('quality', opts.quality); };
$('#bSet').onclick = () => { $('#settings').classList.toggle('hidden'); $('#help').classList.add('hidden'); };
$('#bHelp').onclick = () => { $('#help').classList.toggle('hidden'); $('#settings').classList.add('hidden'); };
$('#help').innerHTML = (isTouch
  ? '<b>Phone:</b> left thumb moves (push all the way up to sprint), drag on the right to look. Hold <b>FIRE</b> and drag it to aim while shooting. <b>AIM</b> zooms in. <b>USE</b> pops up next to things you can buy.'
  : '<b>PC:</b> WASD move · Shift sprint · Mouse aim/shoot · Right-click zoom · R reload · F use/buy (hold to rebuild windows) · V knife · G grenade · Q / 1 / 2 / wheel swap · Esc pause.')
  + '<br><br>Zombies break in through the windows. Every hit is +10 points, kills are +60 (headshots +100, knife +130). Spend points on guns from the walls, the <b>?</b> box (950), doors to new rooms, and perk machines. Turn on the <b>power</b> in the Generator Room to use perks and the <b>Upgrade</b> machine in the Lab (5000). Zombies sometimes drop power-ups: Max Ammo, Insta-Kill, Double Points, Kaboom and Carpenter.';
$('#play').onclick = startGame;
$('#nm').addEventListener('keydown', e => { if(e.key === 'Enter') startGame(); });
function checkRotate(){ $('#rotate').style.display = (isTouch && innerHeight > innerWidth && G_STATE === 'play') ? 'grid' : 'none'; }
addEventListener('resize', checkRotate); setInterval(checkRotate, 1000);
loadLB('#lb');
$('#load').classList.add('hidden');
requestAnimationFrame(frame);
window.__iz = { P, Z, RS, W, BOX, UPG, DOORS, startRound, openDoor, spawnZombie, applyPU, get state(){ return G_STATE; },
  tick(sec, fn){ const n = Math.round(sec * 30); for(let i = 0; i < n; i++){ if(fn) fn(i); now += 1/30; update(1/30); } renderer.clear(); renderer.render(scene, camera); renderer.clearDepth(); renderer.render(vmScene, vmCam); return { round: RS.round, alive: Z.filter(z => !z.dead).length, hp: P.hp, pts: P.points }; } };
</script>
