<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iitsty Zombies · Map Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--line:#2c2c33;--fg:#e9e4da;--dim:#9a958c;--red:#ff4b4b;--gold:#ffd84a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px Oswald,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
h1{font:400 34px Creepster,serif;color:var(--red);margin:0;letter-spacing:1px;line-height:1}
h1 small{font:600 15px Oswald;color:var(--dim);letter-spacing:0;margin-left:6px}
a{color:var(--gold)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:600 14px Oswald,sans-serif;color:var(--fg);background:#222228;border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:38px}
button{cursor:pointer}
button.on{background:#5a1414;border-color:var(--red);color:#fff}
button.go{background:#1d4a1d;border-color:#4ac04a}
button.warn{background:#3a1a1a}
input[type=number]{width:74px}
input[type=text]{min-width:0}
.wrap{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 300px}}
.tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tools button{padding:6px 9px;min-height:36px;font-size:13px}
.tools .grp{display:flex;flex-wrap:wrap;gap:5px;padding:5px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.tools .lbl{font-size:11px;color:var(--dim);align-self:center;padding:0 2px;text-transform:uppercase;letter-spacing:1px}
#gridBox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#050506;max-height:72vh;position:relative}
#gridBox.move canvas{touch-action:auto;cursor:grab}
canvas{display:block;touch-action:none;cursor:crosshair}
.side{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.card h3{margin:0 0 6px;font:600 14px Oswald;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.card label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
#checks div{margin:3px 0}
.ok{color:#7dff5a}.bad{color:var(--red)}.meh{color:#ffb84a}
#hint{color:var(--dim);font-size:13px;margin:4px 0 8px;min-height:18px}
textarea{width:100%;min-height:90px;background:#0e0e11;color:var(--fg);border:1px solid var(--line);border-radius:9px;font:12px ui-monospace,monospace;padding:8px}
.doorrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.doorrow b{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:#8a4a12}
.small{font-size:12px;color:var(--dim)}
#floors button.on{background:#ffd84a;color:#111;font-weight:700}
#floors .x{padding:2px 8px;font-size:12px}
</style>
</head>
<body>
<div class="top">
  <h1>Map Maker<small>Iitsty Zombies</small></h1>
  <div class="bar">
    <select id="mapSel" title="Your maps"></select>
    <button id="bNew">＋ New</button>
    <button id="bCopy">⧉ Copy</button>
    <button id="bDel" class="warn">Delete</button>
    <button id="bPlay" class="go">▶ Play</button>
    <a href="./" style="margin-left:4px">← Game</a>
  </div>
</div>
<div class="bar" style="margin-bottom:8px">
  <input id="mName" type="text" placeholder="Map name" style="flex:1;min-width:160px">
  <label class="small">Size <input id="mW" type="number" min="12" max="48"> × <input id="mH" type="number" min="10" max="32"></label>
  <button id="bResize">Resize</button>
  <button id="zOut">－</button><button id="zIn">＋</button>
  <button id="bUndo">↶ Undo</button>
</div>
<div class="bar" id="floors" style="margin-bottom:6px"></div>
<div class="tools" id="tools"></div>
<div id="hint"></div>
<div class="wrap">
  <div id="gridBox"><canvas id="cv"></canvas></div>
  <div class="side">
    <div class="card"><h3>Check</h3><div id="checks"></div></div>
    <div class="card"><h3>Rules</h3>
      <label>Find parts to build the power switch <input type="checkbox" id="oParts"></label>
      <label>Find parts to fix the Upgrade machine <input type="checkbox" id="oUParts"></label>
      <label>Easter eggs (skulls, soul chest, teddies) <input type="checkbox" id="oEggs"></label>
      <label>Hellhound rounds <input type="checkbox" id="oDogs"></label>
      <div class="small">No power switch on the map = power starts on.</div>
    </div>
    <div class="card"><h3>Doors &amp; prices</h3><div id="doors"></div><div class="small">Each door letter is one door. Paint several cells with the same letter for a wide door.</div></div>
    <div class="card"><h3>Share / back up</h3>
      <div class="bar"><button id="bExp">Copy map code</button><button id="bImp">Load map code</button></div>
      <textarea id="code" placeholder="Map code appears here. Paste one here and press Load map code."></textarea>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const LSK = 'iz_maps';
const PERKS = { revive: ['Second Wind', '#3aa0ff'], tough: ['Tough Brew', '#ff3030'], rapid: ['Rapid Fire', '#ffd030'], speed: ['Speed Mix', '#40ff70'], stamina: ['Stamina Shot', '#ff9a30'] };
const GUNS = { rifle: ['Garand-K', 500], smg: ['Ranger SMG', 1000], ar: ['Storm AR', 1400], shotgun: ['Trench 12', 1500], revolver: ['Python .357', 1200], sniper: ['Vulture .50', 2000], lmg: ['Brute LMG', 2500] };
const STDIR = { e: [1, 0], w: [-1, 0], s: [0, 1], n: [0, -1] }; let stDir = 'e';
const TOOLS = [
  ['Paint', [['wall', '🧱 Wall'], ['floor', '⬜ Floor'], ['out', '🌲 Outside'], ['win', '🪟 Window'], ['door', '🚪 Door'], ['crate', '📦 Crate']]],
  ['Place', [['spawn', '🧍 Start'], ['box', '❓ Box spot'], ['perk', '🥤 Perk'], ['buy', '🔫 Wall buy'], ['upg', '⬆ Upgrade'], ['power', '⚡ Power'], ['barrel', '🛢 Barrel'], ['fire', '🔥 Fire barrel'], ['light', '💡 Light'], ['name', '🏷 Room name'], ['stairs', '🪜 Stairs']]],
  ['Edit', [['rotate', '↻ Turn'], ['erase', '✖ Remove thing'], ['move', '✋ Scroll']]],
];
const HINTS = {
  wall: 'Drag to paint walls.', floor: 'Drag to paint floor (also clears walls).', out: 'Open air: zombies come from here to the windows. The edge of the map counts as outside too.',
  win: 'Windows go in a wall between a room and the outside (or the map edge). Zombies climb in through them.', door: 'Paint a door between two rooms. Pick the letter below; cells with the same letter open together.',
  crate: 'Crates block walking but you can shoot over them.', spawn: 'Where you start. That room is open from the start.', box: 'Mystery box spots (it moves between them). Put them against a wall.',
  perk: 'Pick a perk, then tap a floor cell against a wall.', buy: 'Pick a gun, then tap a floor cell next to a wall; the chalk drawing goes on that wall.', upg: 'The Upgrade machine (one per map).',
  power: 'Power switch: tap a floor cell next to a wall.', barrel: 'A plain barrel.', fire: 'A burning barrel (lights the room).', light: 'Ceiling lights. If you place none, lights are added for you.',
  name: 'Tap a room to name it.', stairs: 'On the lower floor, pick a direction, then tap where the bottom step goes. 4 steps go up that way; the floor above gets a hole and a landing.', rotate: 'Tap a perk, box, Upgrade machine or wall buy to turn it.', erase: 'Tap a placed thing to remove it.', move: 'Drag to scroll the map (phone).'
};
let maps = {}; try{ maps = JSON.parse(localStorage.getItem(LSK) || '{}'); }catch(e){ maps = {}; }
let id = null, M = null, tool = 'wall', perkSel = 'revive', gunSel = 'rifle', doorSel = 'A', cs = 22, undo = [];
function saveAll(){ try{ localStorage.setItem(LSK, JSON.stringify(maps)); }catch(e){ alert('Could not save: ' + e.message); } }
function blank(w = 26, h = 18){
  const g = []; for(let z = 0; z < h; z++){ let r = ''; for(let x = 0; x < w; x++) r += (x === 0 || z === 0 || x === w - 1 || z === h - 1) ? '#' : '.'; g.push(r); }
  return { v: 1, name: 'My Map', grid: g, doors: {}, names: [], spawn: { x: Math.floor(w / 2), z: Math.floor(h / 2) }, wallbuys: [], perks: {}, box: [], upg: null, power: null, parts: true, upgParts: true, eggs: true, dogs: true, barrels: [], bulbs: [] };
}
function stockCopy(){ // a copy of the built-in Iitsty Outpost to remix
  const w = 40, h = 22, g = []; for(let z = 0; z < h; z++) g.push(new Array(w).fill('#'));
  const R = (x0, z0, x1, z1, c) => { for(let z = z0; z <= z1; z++) for(let x = x0; x <= x1; x++) g[z][x] = c; };
  R(1, 11, 14, 20, '.'); R(1, 1, 14, 9, '.'); R(16, 11, 30, 20, '.'); R(16, 1, 30, 9, '.'); R(32, 1, 38, 9, '.'); R(32, 11, 38, 20, '.');
  const D = (c, cells) => { for(const [x, z] of cells) g[z][x] = c; };
  D('D', [[6,10],[7,10],[8,10]]); D('E', [[15,14],[15,15],[15,16]]); D('F', [[22,10],[23,10],[24,10]]); D('H', [[15,4],[15,5],[15,6]]); D('J', [[31,4],[31,5],[31,6]]); D('K', [[31,16],[31,17],[31,18]]); D('L', [[34,10],[35,10],[36,10]]);
  for(const [x, z] of [[4,21],[11,21],[0,15],[4,0],[10,0],[0,5],[20,21],[27,21],[20,0],[27,0],[35,0],[39,5],[39,15],[35,21]]) g[z][x] = 'W';
  for(const [x, z] of [[3,13],[12,18],[5,3],[18,13],[28,18],[24,4],[19,7],[2,8],[37,2],[33,19],[37,12]]) g[z][x] = 'C';
  const up = []; for(let z = 0; z < h; z++) up.push(new Array(w).fill(' '));
  const RU = (x0, z0, x1, z1, c) => { for(let z = z0; z <= z1; z++) for(let x = x0; x <= x1; x++) up[z][x] = c; };
  RU(19, 0, 31, 9, '#'); RU(20, 2, 30, 8, '.'); RU(20, 1, 21, 1, '.'); RU(26, 1, 30, 1, '.'); up[0][21] = 'W'; up[0][28] = 'W';
  const dn = []; for(let z = 0; z < h; z++) dn.push(new Array(w).fill('#'));
  const RD = (x0, z0, x1, z1, c) => { for(let z = z0; z <= z1; z++) for(let x = x0; x <= x1; x++) dn[z][x] = c; };
  RD(2, 2, 13, 7, '.'); RD(2, 8, 8, 8, '.'); dn[1][6] = 'W'; dn[0][6] = ' '; dn[1][11] = 'W'; dn[0][11] = ' ';
  g[1][23] = '.'; g[1][26] = '#'; g[8][9] = '#';
  return { v: 1, name: 'Outpost Remix', grid: g.map(r => r.join('')), up: { grid: up.map(r => r.join('')) }, down: { grid: dn.map(r => r.join('')) },
    stairs: [{ x: 22, z: 1, dir: [1, 0], len: 4 }, { x: 13, z: 8, dir: [-1, 0], len: 4, lv: -1 }], doors: { D: 750, E: 1000, F: 1250, H: 1250, J: 1500, K: 1500, L: 1000 },
    names: [[7, 16, 'Spawn Room'], [7, 5, 'Storage'], [23, 15, 'Generator Room'], [23, 5, 'Lab'], [35, 5, 'Workshop'], [35, 15, 'Morgue'], [25, 5, 'Offices', 1], [7, 5, 'Boiler Room', -1]], spawn: { x: 7, z: 16, yaw: Math.PI },
    wallbuys: [{ k: 'rifle', x: 14, z: 12, dx: 1, dz: 0 }, { k: 'smg', x: 1, z: 18, dx: -1, dz: 0 }, { k: 'shotgun', x: 14, z: 8, dx: 1, dz: 0 }, { k: 'ar', x: 30, z: 12, dx: 1, dz: 0 }, { k: 'revolver', x: 38, z: 7, dx: 1, dz: 0 }, { k: 'sniper', x: 30, z: 5, dx: 1, dz: 0, lv: 1 }, { k: 'lmg', x: 13, z: 4, dx: 1, dz: 0, lv: -1 }],
    perks: { revive: { x: 13, z: 20, face: [0, -1] }, tough: { x: 16, z: 20, face: [0, -1] }, rapid: { x: 1, z: 8, face: [1, 0] }, speed: { x: 30, z: 8, face: [-1, 0] }, stamina: { x: 16, z: 1, face: [0, 1] } },
    box: [{ x: 7, z: 1, face: [0, 1] }, { x: 24, z: 20, face: [0, -1] }, { x: 27, z: 9, face: [0, -1] }, { x: 36, z: 20, face: [0, -1] }, { x: 21, z: 8, face: [0, -1], lv: 1 }], upg: { x: 7, z: 2, face: [0, 1], lv: -1 }, power: { x: 30, z: 19, wall: [1, 0] },
    parts: true, upgParts: true, eggs: true, dogs: true, barrels: [[1, 11, 1], [13, 1, 0], [29, 11, 1], [29, 1, 0], [14, 19, 0], [32, 9, 1], [38, 11, 0], [2, 7, 1, -1], [12, 2, 0, -1], [30, 8, 0, 1]],
    bulbs: [[4.5,15.5],[10.5,15.5],[4.5,5],[10.5,5],[20,15.5],[26.5,15.5],[20,5],[26.5,5],[35.5,5],[35.5,15.5],[23,5,1],[28,5,1],[5,5,-1],[10.5,5,-1]],
    pipes: [[1,14,12],[1,14,2],[16,30,12],[16,30,2],[1,14,19.5],[16,30,8.5],[32,38,2],[32,38,19.5]] };
}
// ---------- helpers ----------
let FL = 0; // floor being edited: -1 basement, 0 ground, 1 upstairs
const FLNAME = { '-1': 'Basement', '0': 'Ground floor', '1': 'Upstairs' };
function newFloorGrid(lv){ const w = M.grid[0].length, h = M.grid.length; const ch = lv > 0 ? ' ' : '#'; return Array.from({ length: h }, () => ch.repeat(w)); }
function ensureFloor(lv){ if(lv === 1 && !M.up) M.up = { grid: newFloorGrid(1) }; if(lv === -1 && !M.down) M.down = { grid: newFloorGrid(-1) }; }
const gridOf = lv => lv === 0 ? M.grid : lv === 1 ? (M.up && M.up.grid) : (M.down && M.down.grid);
const GR = () => gridOf(FL);
const hasFloor = lv => !!gridOf(lv);
const W_ = () => M.grid[0].length, H_ = () => M.grid.length;
const atF = (lv, x, z) => { const g = gridOf(lv); return g && z >= 0 && z < H_() && x >= 0 && x < W_() ? g[z][x] : undefined; };
const at = (x, z) => atF(FL, x, z);
function setCell(x, z, c){ const g = GR(); const r = g[z]; g[z] = r.slice(0, x) + c + r.slice(x + 1); }
const onF = o => o && ((o.lv || 0) === FL);
function stairCells(st){ const out = []; for(let i = 0; i < (st.len || 4); i++) out.push([st.x + st.dir[0] * i, st.z + st.dir[1] * i]); return out; }
function stairAt(x, z){ for(let i = 0; i < (M.stairs || []).length; i++){ const st = M.stairs[i]; const lo = st.lv || 0; if(lo !== FL && lo + 1 !== FL) continue; if(stairCells(st).some(c => c[0] === x && c[1] === z)) return i; } return -1; }
const isDoor = c => /^[A-Z]$/.test(c || '') && c !== 'W' && c !== 'C' && c !== 'M';
const walk = c => c === '.';
function wallSide(x, z){ for(const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const c = at(x + dx, z + dz); if(c === '#' || c === undefined) return [dx, dz]; } return null; }
function openSide(x, z){ let best = null, bn = -1; for(const [dx, dz] of [[0,1],[0,-1],[1,0],[-1,0]]){ const b = at(x - dx, z - dz); const wb = b === '#' || b === 'W' || b === undefined || b === ' ' || isDoor(b); let n = 0; for(let k = 1; k <= 3; k++){ if(at(x + dx * k, z + dz * k) !== '.') break; n++; } const sc = n + (wb ? 10 : 0); if(n > 0 && sc > bn){ bn = sc; best = [dx, dz]; } } return best || [0, 1]; }
function rooms(){
  const w = W_(), h = H_(), R = []; for(let z = 0; z < h; z++) R.push(new Array(w).fill(-1)); let n = 0; const open = c => c === '.' || c === 'C';
  const fill = (x0, z0, id) => { const q = [[x0, z0]]; R[z0][x0] = id; while(q.length){ const [x, z] = q.pop(); for(const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x + dx, nz = z + dz; if(nx < 0 || nz < 0 || nx >= w || nz >= h || R[nz][nx] >= 0 || !open(M.grid[nz][nx])) continue; R[nz][nx] = id; q.push([nx, nz]); } } };
  const sp = M.spawn; if(sp && onF(sp) && open(at(sp.x, sp.z))) fill(sp.x, sp.z, n++);
  for(let z = 0; z < h; z++) for(let x = 0; x < w; x++) if(R[z][x] < 0 && open(at(x, z))) fill(x, z, n++);
  return { R, n };
}
function thingsAt(x, z){
  const out = [];
  if(onF(M.spawn) && M.spawn.x === x && M.spawn.z === z) out.push(['spawn']);
  M.box.forEach((b, i) => { if(onF(b) && b.x === x && b.z === z) out.push(['box', i]); });
  for(const k in M.perks) if(onF(M.perks[k]) && M.perks[k].x === x && M.perks[k].z === z) out.push(['perk', k]);
  M.wallbuys.forEach((b, i) => { if(onF(b) && b.x === x && b.z === z) out.push(['buy', i]); });
  if(onF(M.upg) && M.upg.x === x && M.upg.z === z) out.push(['upg']);
  if(onF(M.power) && M.power.x === x && M.power.z === z) out.push(['power']);
  M.barrels.forEach((b, i) => { if((b[3] || 0) === FL && b[0] === x && b[1] === z) out.push(['barrel', i]); });
  M.bulbs.forEach((b, i) => { if((b[2] || 0) === FL && Math.floor(b[0]) === x && Math.floor(b[1]) === z) out.push(['light', i]); });
  M.names.forEach((b, i) => { if((b[3] || 0) === FL && b[0] === x && b[1] === z) out.push(['name', i]); });
  const si = stairAt(x, z); if(si >= 0) out.push(['stairs', si]);
  return out;
}
function clearThings(x, z, keep){ for(const [k, i] of thingsAt(x, z)) if(k !== keep && k !== 'name' && k !== 'light' && k !== 'stairs') removeThing(k, i); }
function removeThing(k, i){
  if(k === 'spawn') M.spawn = null; else if(k === 'box') M.box.splice(i, 1); else if(k === 'perk') delete M.perks[i]; else if(k === 'buy') M.wallbuys.splice(i, 1);
  else if(k === 'stairs') M.stairs.splice(i, 1); else if(k === 'upg') M.upg = null; else if(k === 'power') M.power = null; else if(k === 'barrel') M.barrels.splice(i, 1); else if(k === 'light') M.bulbs.splice(i, 1); else if(k === 'name') M.names.splice(i, 1);
}
function allCells(){ return [M.grid, gridOf(1), gridOf(-1)].filter(Boolean).map(g => g.join('')).join(''); }
function nextDoorLetter(){ const used = new Set(Object.keys(M.doors)); for(const c of allCells()) if(isDoor(c)) used.add(c); for(const c of 'ABDEFGHIJKLNOPQRSTUVXYZ') if(!used.has(c)) return c; return 'Z'; }
// ---------- UI ----------
function buildTools(){
  const T = $('#tools'); T.innerHTML = '';
  for(const [lbl, list] of TOOLS){ const g = document.createElement('div'); g.className = 'grp'; g.innerHTML = `<span class="lbl">${lbl}</span>`; for(const [k, t] of list){ const b = document.createElement('button'); b.textContent = t; b.dataset.t = k; b.onclick = () => setTool(k); g.appendChild(b); } T.appendChild(g); }
  const ex = document.createElement('div'); ex.className = 'grp'; ex.id = 'extra'; T.appendChild(ex);
  setTool(tool);
}
function setTool(k){
  tool = k; document.querySelectorAll('#tools button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === k));
  $('#gridBox').classList.toggle('move', k === 'move'); $('#hint').textContent = HINTS[k] || '';
  const ex = $('#extra'); ex.innerHTML = '';
  if(k === 'perk'){ ex.innerHTML = '<span class="lbl">Perk</span>' + Object.keys(PERKS).map(p => `<button data-p="${p}" class="${p === perkSel ? 'on' : ''}" style="color:${PERKS[p][1]}">${PERKS[p][0]}</button>`).join(''); ex.querySelectorAll('button').forEach(b => b.onclick = () => { perkSel = b.dataset.p; setTool('perk'); }); }
  else if(k === 'buy'){ ex.innerHTML = '<span class="lbl">Gun</span>' + Object.keys(GUNS).map(p => `<button data-p="${p}" class="${p === gunSel ? 'on' : ''}">${GUNS[p][0]} ${GUNS[p][1]}</button>`).join(''); ex.querySelectorAll('button').forEach(b => b.onclick = () => { gunSel = b.dataset.p; setTool('buy'); }); }
  else if(k === 'door'){ const letters = [...new Set([...Object.keys(M.doors), ...allCells().split('').filter(isDoor)])].sort(); if(!letters.includes(doorSel)) letters.push(doorSel);
    ex.innerHTML = '<span class="lbl">Door</span>' + letters.map(c => `<button data-p="${c}" class="${c === doorSel ? 'on' : ''}">${c}</button>`).join('') + '<button data-p="+">＋ new door</button>';
    ex.querySelectorAll('button').forEach(b => b.onclick = () => { doorSel = b.dataset.p === '+' ? nextDoorLetter() : b.dataset.p; setTool('door'); }); }
  else if(k === 'stairs'){ ex.innerHTML = '<span class="lbl">Up toward</span>' + [['n','↑'],['e','→'],['s','↓'],['w','←']].map(([d, a]) => `<button data-p="${d}" class="${d === stDir ? 'on' : ''}">${a}</button>`).join(''); ex.querySelectorAll('button').forEach(b => b.onclick = () => { stDir = b.dataset.p; setTool('stairs'); }); }
  ex.style.display = ex.innerHTML ? '' : 'none';
}
function snapshot(){ undo.push(JSON.stringify(M)); if(undo.length > 60) undo.shift(); }
function commit(){ maps[id] = M; saveAll(); if(!hasFloor(FL)) FL = 0; floorsUI(); draw(); checks(); doorsUI(); }

$('#zIn').onclick = () => { cs = Math.min(48, cs + 4); draw(); }; $('#zOut').onclick = () => { cs = Math.max(8, cs - 4); draw(); };
$('#bUndo').onclick = () => { const u = undo.pop(); if(!u) return; M = JSON.parse(u); maps[id] = M; commit(); };
$('#bExp').onclick = async () => { const t = btoa(unescape(encodeURIComponent(JSON.stringify(M)))); $('#code').value = t; try{ await navigator.clipboard.writeText(t); flash('Map code copied. Paste it to a friend or into Notes to keep it.'); }catch(e){ $('#code').select(); flash('Select the code and copy it.'); } };
$('#bImp').onclick = () => { const t = $('#code').value.trim(); if(!t) return flash('Paste a map code into the box first.'); try{ const m = JSON.parse(decodeURIComponent(escape(atob(t)))); if(!m.grid || !m.grid.length) throw 0; delete m.stock; newMap(m); flash('Map loaded as a new map.'); }catch(e){ flash('That map code did not work.'); } };
// ---------- painting ----------
let down = false, lastCell = '';
function cellOf(e){ const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / cs), Math.floor((e.clientY - r.top) / cs)]; }
cv.addEventListener('pointerdown', e => { if(tool === 'move') return; e.preventDefault(); cv.setPointerCapture(e.pointerId); down = true; snapshot(); const [x, z] = cellOf(e); lastCell = x + ',' + z; apply(x, z, true); draw(); });
cv.addEventListener('pointermove', e => { if(!down) return; const [x, z] = cellOf(e); const k = x + ',' + z; if(k === lastCell) return; lastCell = k; apply(x, z, false); draw(); });
const up = () => { if(!down) return; down = false; commit(); }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
// scroll tool for phones
let drag = null; $('#gridBox').addEventListener('pointerdown', e => { if(tool !== 'move') return; drag = { x: e.clientX, y: e.clientY, sl: $('#gridBox').scrollLeft, st: $('#gridBox').scrollTop }; });
window.addEventListener('pointermove', e => { if(!drag) return; $('#gridBox').scrollLeft = drag.sl - (e.clientX - drag.x); $('#gridBox').scrollTop = drag.st - (e.clientY - drag.y); });
window.addEventListener('pointerup', () => drag = null);
window.addEventListener('resize', () => { const old = cs; fit(); if(cs !== old) draw(); });
// ---------- start ----------
buildTools();
const last = (() => { try{ return localStorage.getItem('iz_maker_last'); }catch(e){ return null; } })();
if(last && maps[last]) load(last); else if(Object.keys(maps).length) load(Object.keys(maps)[0]); else newMap(blank());
</script>
</body>
