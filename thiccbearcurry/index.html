<style>
/* =====================================================================
   thiccbearcurry — bio page with switchable themes.
   Everything you'd want to change is in CONFIG near the bottom.
   ===================================================================== */
:root{
  --accent:#ff7eb6; --accent2:#9d8bff;
  --text:#f6f0ff; --muted:#c9b8dc;
  --card:rgba(30,18,48,.45); --line:rgba(255,190,225,.18);
  --icon:#f2eefc;
  --title:'Mochiy Pop One',sans-serif;
  --grad:linear-gradient(90deg,#fff,#ffc4e1,#c9b8ff,#fff);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--text);font-family:'M PLUS Rounded 1c',sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#bgCanvas,#bgVideo,#bgImage{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#bgVideo,#bgImage{display:none;filter:brightness(.7)}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer;
  background:rgba(5,3,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:opacity .9s ease,visibility .9s;text-align:center}
#splash.gone{opacity:0;visibility:hidden}
#splashText{font-family:var(--title);font-size:clamp(24px,5vw,40px);letter-spacing:1px;
  text-shadow:0 0 14px var(--accent);animation:breathe 2.4s ease-in-out infinite;display:block}
#splash small{display:block;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:4px}
@keyframes breathe{50%{opacity:.45;transform:scale(.97)}}

/* ---------- layout ---------- */
#stage{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding:20px;perspective:1100px;overflow-y:auto}
#profile{width:min(640px,100%);transform-style:preserve-3d;opacity:0;transform:translateY(30px) scale(.97)}
#profile.show{opacity:1;transform:none;transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#profile.tilting{transition:transform .15s ease-out}

.nameRow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.orn{width:var(--ornSize,42px);height:var(--ornSize,42px);flex:0 0 var(--ornSize,42px);filter:drop-shadow(0 0 8px var(--accent))}
.orn svg{width:100%;height:100%;display:block}
.a-spin{animation:spin 6s linear infinite}.a-spin.r{animation-direction:reverse}
.a-flip{animation:flip 3s ease-in-out infinite}.a-flip.r{animation-delay:-1.5s}
.a-sway{animation:sway 2.2s ease-in-out infinite;transform-origin:50% 90%}.a-sway.r{animation-delay:-1.1s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flip{to{transform:rotateY(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.12)}}

h1{font-family:var(--title);font-weight:400;font-size:clamp(38px,9vw,66px);line-height:1.05;letter-spacing:1px;
  background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;filter:drop-shadow(0 0 10px var(--accent))}
@keyframes shine{to{background-position:300% 0}}
.jp{display:block;text-align:center;font-size:12px;letter-spacing:6px;color:var(--accent);opacity:.9;margin-bottom:6px}
.bio{text-align:center;min-height:24px;color:var(--muted);font-size:14px;margin-bottom:22px}
.bio .cur{display:inline-block;width:8px;background:var(--text);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:12px;align-items:center;
  position:relative;overflow:hidden;min-height:86px;transition:border-color .3s,box-shadow .3s,transform .3s}
.card:hover{border-color:var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.card .tag{position:absolute;top:8px;right:12px;font-size:10px;color:var(--muted);opacity:.8;display:flex;gap:4px;align-items:center}
.av{position:relative;flex:0 0 56px;height:56px}
.av img,.av svg{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--accent)}
.av::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px dashed var(--accent);opacity:.55;animation:spin 12s linear infinite}
.dot{position:absolute;right:0;bottom:0;width:15px;height:15px;border-radius:50%;border:3px solid #0b0910;background:#747f8d}
.dot.online{background:#23a55a}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
.cinfo{min-width:0}
.cname{font-family:var(--title);font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.counts{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:4px}
.counts i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.join{display:inline-block;margin-top:6px;background:#23a55a;color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:6px}
.join:hover{filter:brightness(1.2)}
.sicon{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));overflow:hidden}
.sicon img{width:100%;height:100%;object-fit:cover}
.sicon svg{width:36px;height:36px}

/* ---------- socials ---------- */
.socials{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.socials .x{width:18px;height:18px;display:inline-block}
.socials .x svg{width:100%;height:100%}
.soc{width:38px;height:38px;display:grid;place-items:center;position:relative;transition:transform .25s}
.soc svg{width:30px;height:30px;fill:var(--icon);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.soc:hover{transform:translateY(-4px) scale(1.12)}
.soc:hover svg{filter:drop-shadow(0 0 10px var(--accent))}
.soc .tip{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#fff;
  background:rgba(0,0,0,.8);padding:2px 7px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .2s}
.soc:hover .tip{opacity:1}

/* ---------- player ---------- */
.player{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cover{flex:0 0 58px;height:58px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:24px;color:#fff}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.spin{animation:spin 8s linear infinite}
.pmid{flex:1;min-width:0}
.ptitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partist{font-size:11px;color:var(--muted);margin-bottom:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted)}
.track{flex:1;height:4px;border-radius:4px;background:rgba(127,127,127,.3);cursor:pointer;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pbtns{display:flex;align-items:center;gap:6px}
.pbtns button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.pbtns button:hover{background:rgba(127,127,127,.18)}
.pbtns svg{width:18px;height:18px;fill:var(--icon)}
.pbtns .big svg{width:24px;height:24px}
#loadSong{font-size:10px;color:var(--muted);text-align:center;margin-top:8px;display:block;width:100%;opacity:.75}
#loadSong:hover{opacity:1}

/* ---------- corner widgets ---------- */
.cornerBtn{position:fixed;top:16px;z-index:20;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:rgba(15,10,25,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.cornerBtn svg{width:22px;height:22px;fill:#eee}
#mute{left:16px}#themeBtn{right:16px}#musicBtn{right:72px}
#themeMenu{max-height:min(70vh,560px);overflow-y:auto;position:fixed;top:70px;right:16px;z-index:21;background:rgba(12,8,20,.92);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:6px;display:none;min-width:190px;backdrop-filter:blur(10px)}
#themeMenu.open{display:block}
#musicPanel{position:fixed;top:70px;right:16px;z-index:21;width:min(340px,92vw);max-height:calc(100vh - 90px);overflow:auto;
  background:rgba(12,8,20,.95);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;display:none;color:#eee;font-size:12.5px}
#musicPanel.open{display:block}
#musicPanel h3{font-size:14px;margin-bottom:8px}
#musicPanel p{color:#aaa;margin:6px 0;line-height:1.45}
#musicPanel input[type=text],#musicPanel input[type=password]{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  color:#fff;border-radius:8px;padding:7px 9px;margin:4px 0;font:inherit}
#musicPanel input[type=file]{width:100%;margin:4px 0;color:#ccc;font-size:11.5px}
#musicPanel .row{display:flex;gap:6px;margin-top:6px}
#musicPanel .row button,#musicPanel .wbtn{flex:1;padding:8px;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700}
#musicPanel .wbtn{width:100%;margin-top:6px;display:block}
#musicPanel .row button.go,#musicPanel .go{background:var(--accent);color:#111}
#musicPanel hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:12px 0}
#musicPanel summary{cursor:pointer;color:#ccc;margin-top:4px}
#mpList .song{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);margin-bottom:4px}
#mpList .song span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mpList .song button{opacity:.6}#mpList .song button:hover{opacity:1}
#mpStatus{margin-top:8px;min-height:16px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.07);font-size:11px;cursor:pointer;user-select:none}
.chip input{accent-color:var(--accent)}
.chip:has(input:checked){background:color-mix(in srgb,var(--accent) 35%,transparent)}
#mpList .song{flex-wrap:wrap}
#mpList .tags{flex-basis:100%;font-size:10.5px;color:#999;padding-left:14px}
#mpList .edit{flex-basis:100%}
#themeMenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:13px;color:#eee;text-align:left}
#themeMenu button:hover,#themeMenu button.on{background:rgba(255,255,255,.08)}
#themeMenu i{width:14px;height:14px;border-radius:50%;flex:0 0 14px}
.foot{position:fixed;bottom:14px;right:16px;z-index:20;font-size:10px;color:rgba(255,255,255,.4)}

#chara{position:fixed;z-index:4;right:3vw;bottom:0;height:min(80vh,740px);max-width:30vw;object-fit:contain;object-position:bottom;
  display:none;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 55%,transparent));animation:float 6s ease-in-out infinite;pointer-events:none}
#chara.left{right:auto;left:3vw}
#chara{transition:opacity .6s}
#chara.hide{opacity:0!important}
#chara.wide{height:auto;width:min(30vw,560px);max-width:none;bottom:2vh}
.orn img,.socials .x img{width:100%;height:100%;object-fit:contain;display:block}
.sicon img.ornimg{width:80%;height:80%;object-fit:contain}
@keyframes float{50%{transform:translateY(-14px)}}

.spark{position:fixed;z-index:60;pointer-events:none;font-size:12px;color:var(--accent);
  text-shadow:0 0 6px var(--accent);animation:sparkFade .9s forwards}
@keyframes sparkFade{to{opacity:0;transform:translateY(18px) scale(.3) rotate(90deg)}}
.spark.burst{animation:sparkBurst .8s ease-out forwards}
@keyframes sparkBurst{to{opacity:0;transform:translate(var(--bx),var(--by)) scale(.4) rotate(180deg)}}

/* ---------- per-theme touches ---------- */
body[data-theme=haunted] h1{letter-spacing:3px}
body[data-theme=cursed] h1{font-style:italic;letter-spacing:2px}
body[data-theme=hero] h1{-webkit-text-stroke:2px #111;filter:drop-shadow(4px 4px 0 #111);letter-spacing:3px}
body[data-theme=hero] .card,body[data-theme=hero] .player{background:#fffdf3;color:#151515;border:3px solid #111;
  box-shadow:5px 5px 0 #111;border-radius:12px;backdrop-filter:none}
body[data-theme=hero] .card .csub,body[data-theme=hero] .card .counts,body[data-theme=hero] .partist,body[data-theme=hero] .bar,body[data-theme=hero] .card .tag{color:#555}
body[data-theme=hero] .pbtns svg{fill:#151515}
body[data-theme=hero] .bio{color:#fff;text-shadow:2px 2px 0 #111;font-weight:800}
body[data-theme=hero] .jp{color:#fff;text-shadow:2px 2px 0 #111}
body[data-theme=hero] .soc svg{filter:drop-shadow(3px 3px 0 #111)}
body[data-theme=gotham] h1{letter-spacing:4px;text-transform:uppercase}
body[data-theme=gotham] .card,body[data-theme=gotham] .player{border-radius:6px}

body.customCursor,body.customCursor *{cursor:var(--cur) !important}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .orn{width:calc(var(--ornSize,42px)*.72);height:calc(var(--ornSize,42px)*.72);flex-basis:calc(var(--ornSize,42px)*.72)}
  #stage{align-items:flex-start;padding-top:80px}
  #chara{opacity:.3;max-width:75vw;right:-10vw}
  #chara.wide{width:90vw;right:-5vw}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:70;background:rgba(10,8,18,.92);color:#fff;
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 16px;font-size:12.5px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- theme editor + effects ---------- */
#fxCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none}
#editBtn{right:72px}
.nameRow[data-orn=left] #ornR,.nameRow[data-orn=right] #ornL,.nameRow[data-orn=none] .orn,
.nameRow[data-orn=above] #ornR,.nameRow[data-orn=below] #ornR{display:none}
.nameRow[data-orn=above]{flex-direction:column;gap:2px}.nameRow[data-orn=below]{flex-direction:column-reverse;gap:2px}
body.noSocOrn .socials .x{display:none}
body.dragChar #chara{pointer-events:auto;z-index:6;cursor:move!important;outline:2px dashed var(--accent);outline-offset:4px;animation:none}
#editPanel{position:fixed;top:70px;right:16px;bottom:16px;z-index:22;width:min(360px,94vw);display:none;flex-direction:column;
  background:rgba(12,8,20,.94);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#eee;font-size:12.5px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
#editPanel.open{display:flex}
#editPanel .epHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px;font-size:14px}
#editPanel .epHead button{font-size:16px;opacity:.7}
#editPanel .epTabs{display:flex;gap:3px;padding:0 10px 8px;flex-wrap:wrap}
#editPanel .epTabs button{flex:1;padding:6px 4px;border-radius:8px;background:rgba(255,255,255,.06);font-size:11.5px;font-weight:700;white-space:nowrap}
#editPanel .epTabs button.on{background:var(--accent);color:#111}
#epBody{flex:1;overflow:auto;padding:4px 14px 10px}
#epBody b{display:block;margin:8px 0 4px;font-size:13px}#epBody b i,#epBody p i{font-weight:400;color:#aaa}
#epBody p{color:#aaa;margin:4px 0;line-height:1.45}
#epBody hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:12px 0}
#epBody code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:11px}
.ef{display:flex;flex-direction:column;gap:4px;margin:8px 0}.ef>span{color:#ccc;font-size:11.5px}.ef>span i{color:#888;font-style:normal}
#epBody input[type=text],#epBody textarea,#epBody select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  border-radius:8px;padding:7px 9px;color:#fff;font:inherit;font-size:12.5px}
#epBody select option{background:#1a1424}
#epBody textarea{resize:vertical;min-height:70px;cursor:text!important}
#epBody input[type=range]{width:100%;accent-color:var(--accent)}
#epBody input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;align-self:flex-start}
#epBody input[type=color]{width:42px;height:28px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:none;padding:1px}
.pair{display:flex;gap:8px;align-items:center}.pair input[type=range]{flex:1}
#epBody .wbtn,.epFoot button{display:block;width:100%;margin-top:6px;padding:8px;border-radius:8px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;text-align:center}
#epBody .wbtn.go,.epFoot .go{background:var(--accent);color:#111}
#epBody .wbtn.danger{background:rgba(255,70,70,.2);color:#ffb3b3}
#epBody .upl{cursor:pointer}
#epBody .link{color:var(--accent);font-size:11px;text-decoration:underline}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumbs .th{position:relative;width:60px;height:72px;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center;overflow:hidden}
.thumbs img{max-width:100%;max-height:100%;object-fit:contain}
.thumbs button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);font-size:10px}
img.mini{height:28px;vertical-align:middle;margin:0 4px}
.ornGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:6px 0}
.ornGrid button{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.06);padding:5px}
.ornGrid button.on{background:color-mix(in srgb,var(--accent) 45%,transparent);outline:1px solid var(--accent)}
.ornGrid svg{width:100%;height:100%}
.fx{border:1px solid rgba(255,255,255,.08);border-radius:9px;margin:6px 0;padding:6px 9px}
.fx.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:rgba(255,255,255,.03)}
.fxh{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.epFoot{padding:8px 14px 12px;border-top:1px solid rgba(255,255,255,.1)}
.epFoot .row{display:flex;gap:6px}.epFoot .row button{flex:1}
#epStatus{display:block;color:#aaa;font-size:11.5px;min-height:15px}
@media (max-width:560px){ #editPanel{top:auto;height:62vh;right:3vw;left:3vw;width:auto;bottom:10px} }
#epBody input[type=password]{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 9px;color:#fff;font:inherit;margin:4px 0}
#epBody .pair .wbtn{flex:1}
.decoLayer{position:fixed;inset:0;pointer-events:none;z-index:3}#decoFront{z-index:6}
.deco{position:absolute}.deco .dIn{width:100%;height:100%;display:grid;place-items:center}
.deco svg,.deco img{width:100%;height:100%;object-fit:contain;display:block}
.deco .demoji{line-height:1;white-space:nowrap}

function sigil(letter){
  return `<svg viewBox="0 0 56 56"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>
  <circle cx="28" cy="28" r="28" fill="url(#sg)"/><text x="28" y="37" text-anchor="middle" style="font-family:var(--title)" font-size="24" fill="#fff">${letter}</text></svg>`;
}

/* ---------- typewriter ---------- */
let bioI = 0, bioJ = 0, bioDel = false, bioTimer;
function typeTick(){
  const lines = T.bios, line = lines[bioI % lines.length] || '';
  $('bioText').textContent = line.slice(0, bioJ);
  if(!bioDel && bioJ < line.length){ bioJ++; return bioTimer = setTimeout(typeTick, 60); }
  if(!bioDel){ bioDel = true; return bioTimer = setTimeout(typeTick, 2200); }
  if(bioJ > 0){ bioJ--; return bioTimer = setTimeout(typeTick, 28); }
  bioDel = false; bioI++; bioTimer = setTimeout(typeTick, 400);
}

const STATUS_TEXT = {online:'online', idle:'idle', dnd:'do not disturb', offline:'offline'};
let user = {...CONFIG.fallbackUser}, server = {...CONFIG.fallbackServer};
function renderUser(){
  const u = user;
  $('uAv').innerHTML = u.avatar ? `<img src="${u.avatar}" alt="">` : sigil(CONFIG.name[0].toUpperCase());
  $('uName').textContent = u.name;
  $('uDot').className = 'dot ' + u.status;
  $('uStatus').textContent = u.custom || (u.status === 'offline' ? (u.note || 'offline') : STATUS_TEXT[u.status]);
  $('uActivity').textContent = u.activity ? '▸ playing ' + u.activity : '';
  if(window.SITEF) siteUserExtras(u);
}
function renderServer(){
  const s = server;
  const card = $('sName').closest('.card'); card.style.display = CONFIG.discordInvite ? '' : 'none';
  document.querySelector('.cards').style.gridTemplateColumns = CONFIG.discordInvite ? '' : '1fr';
  document.querySelector('.cards').style.maxWidth = CONFIG.discordInvite ? '' : '360px';
  document.querySelector('.cards').style.margin = CONFIG.discordInvite ? '' : '0 auto 18px';
  $('sName').textContent = s.name;
  $('sOnline').textContent = s.online.toLocaleString();
  $('sMembers').textContent = s.members.toLocaleString();
  const oi = (CONFIG.themes[themeKey]||{}).ornament;
  $('sIcon').innerHTML = s.icon ? `<img src="${s.icon}" alt="">` : (oi ? `<img class="ornimg" src="${oi}" alt="">` : orn(T.orn));
  const j = $('sJoin');
  if(CONFIG.discordInvite) j.href = 'https://discord.gg/' + CONFIG.discordInvite;
  else { j.removeAttribute('href'); j.style.opacity = .55; j.style.cursor = 'default'; }

async function loadPresence(){
  if(!CONFIG.discordUserId) return;
  try{
    const {data} = await (await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordUserId}`)).json();
    const d = data.discord_user;
    user = { name: d.global_name || d.username,
      avatar: d.avatar ? `https://cdn.discordapp.com/avatars/${d.id}/${d.avatar}.${d.avatar.startsWith('a_')?'gif':'png'}?size=128` : '',
      status: data.discord_status, custom: (data.activities.find(a=>a.type===4)||{}).state,
      activity: (data.activities.find(a=>a.type===0)||{}).name, note: CONFIG.fallbackUser.note, raw: data };
    renderUser();
  }catch(e){}
}
async function loadServer(){
  if(!CONFIG.discordInvite) return;
  try{
    const d = await (await fetch(`https://discord.com/api/v9/invites/${CONFIG.discordInvite}?with_counts=true`)).json();
    server = { name: d.guild.name, icon: d.guild.icon ? `https://cdn.discordapp.com/icons/${d.guild.id}/${d.guild.icon}.png?size=128` : '',
      online: d.approximate_presence_count || 0, members: d.approximate_member_count || 0 };
    renderServer();
  }catch(e){}
}

const audio = $('audio');
let songs = [], siteSongs = [], localSongs = [], idx = 0, muted = false;
audio.volume = CONFIG.volume;
const fmt = t => isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00';
function loadSongAt(i){
  if(!songs.length) return;
  idx = (i + songs.length) % songs.length; const s = songs[idx];
  audio.src = s.src; $('pTitle').textContent = s.title || 'untitled'; $('pArtist').textContent = s.artist || '—';
  if(window._edReady) refreshCover(); else $('pCover').innerHTML = s.cover ? `<img src="${s.cover}" alt="">` : '♪';
}
const setPlayIcon = () => { $('pPlay').innerHTML = audio.paused ? PLAY : PAUSE; $('pCover').classList.toggle('spin', !audio.paused); };
const play = () => { if(songs.length) audio.play().catch(()=>{}); };
$('pPlay').onclick = () => { if(songs.length) audio.paused ? play() : audio.pause(); };
$('pNext').onclick = () => { loadSongAt(idx+1); play(); };
$('pPrev').onclick = () => { if(audio.currentTime > 3) audio.currentTime = 0; else { loadSongAt(idx-1); play(); } };
audio.onplay = audio.onpause = setPlayIcon;
audio.onended = () => { loadSongAt(idx+1); play(); };
audio.ontimeupdate = () => {
  $('pCur').textContent = fmt(audio.currentTime); $('pDur').textContent = fmt(audio.duration);
  $('pFill').style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
};
$('pTrack').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); if(audio.duration) audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; };
const allSongs = () => [...CONFIG.songs, ...siteSongs, ...localSongs];
const fitsTheme = (s, k) => !s.themes || !s.themes.length || s.themes.includes(k);
function rebuildPlaylist(){
  const wasPlaying = !audio.paused, cur = songs[idx];
  // songs made for this theme play first, "all themes" songs after
  const own = allSongs().filter(s => s.themes && s.themes.includes(themeKey));
  const any = allSongs().filter(s => !s.themes || !s.themes.length);
  songs = [...own, ...any];
  let ni = cur ? songs.findIndex(s => s.src === cur.src) : -1;
  if(own.length && ni >= own.length) ni = -1; // theme has its own songs → switch to them
  if(ni >= 0){ idx = ni; }
  else {
    audio.pause(); audio.removeAttribute('src'); idx = 0;
    $('pTitle').textContent = 'no song loaded'; $('pArtist').textContent = '—'; $('pFill').style.width = 0;
    if(songs.length){ loadSongAt(0); if(wasPlaying) play(); }
  }
  refreshPlayer(); setPlayIcon();
}
function refreshPlayer(){
  $('player').style.display = songs.length ? 'flex' : 'none';
  if(songs.length && !audio.getAttribute('src')) loadSongAt(0);
}
setPlayIcon();
$('mute').innerHTML = VOL;
$('mute').onclick = () => { muted = !muted; audio.muted = muted; $('mute').innerHTML = muted ? MUTED : VOL; };

let lastSpark = 0;
function spark(x, y, burst){
  const s = document.createElement('span'); s.className = 'spark' + (burst ? ' burst' : '');
  s.textContent = T.sparks[Math.random() < .5 ? 0 : 1];
  s.style.left = x + 'px'; s.style.top = y + 'px';
  if(burst){ const a = Math.random()*Math.PI*2, d = 30 + Math.random()*40;
    s.style.setProperty('--bx', Math.cos(a)*d + 'px'); s.style.setProperty('--by', Math.sin(a)*d + 'px');
    s.style.fontSize = (12 + Math.random()*10) + 'px'; }
  document.body.appendChild(s); setTimeout(() => s.remove(), 900);
}
function trail(x, y){ const now = performance.now(); if(now - lastSpark < 35) return; lastSpark = now; spark(x, y); }
// mouse / pen trail
addEventListener('pointermove', e => { if(e.pointerType !== 'touch') trail(e.clientX, e.clientY); });
// finger swipe trail (touchmove keeps firing while the page scrolls)
addEventListener('touchmove', e => { for(const t of e.touches) trail(t.clientX, t.clientY); }, {passive:true});
// tap / click = little burst
addEventListener('pointerdown', e => { for(let i=0;i<8;i++) spark(e.clientX, e.clientY, true); });

/* =====================================================================
   ANIMATED SCENES — one per theme
   Each scene: build(back, front, W, H) draws static layers once,
   mid(ctx,...) animates between them, top(ctx,...) animates on top.
   ===================================================================== */
const R = Math.random, TAU = Math.PI*2;
const rr = (a,b) => a + R()*(b-a);

function hills(g, W, H, base, amp, col, seed){
  g.fillStyle = col; g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<=W;x+=8) g.lineTo(x, base + Math.sin(x*.004+seed)*amp + Math.sin(x*.011+seed*2)*amp*.4);
  g.lineTo(W,H); g.fill();
}
function tree(g, x, y, a, len, w, d, leaf){
  if(d > 6 || len < 6){ if(leaf) leaf(x,y); return; }
  const nx = x + Math.cos(a)*len, ny = y + Math.sin(a)*len;
  g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x,y); g.lineTo(nx,ny); g.stroke();
  tree(g, nx, ny, a - rr(.35,.65), len*.74, w*.68, d+1, leaf);
  tree(g, nx, ny, a + rr(.3,.6),  len*.7,  w*.68, d+1, leaf);
}
function starsArr(W,H,yMax,n){ return Array.from({length:n},()=>({x:R()*W,y:R()*H*yMax,r:rr(.3,1.6),p:R()*6,s:rr(.5,2.5)})); }
function drawStars(ctx, st, t, col){
  for(const s of st){ ctx.globalAlpha = .3 + .7*Math.abs(Math.sin(t*s.s+s.p)); ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function skyline(g, W, H, opts){
  let x = -10;
  while(x < W){
    const bw = rr(opts.minW, opts.maxW), bh = H*rr(opts.minH, opts.maxH), top = H - bh;
    g.fillStyle = opts.col; g.fillRect(x, top, bw, bh);
    if(opts.deco && R() < .4){ // stepped art-deco top + spire
      g.fillRect(x+bw*.15, top-bh*.06, bw*.7, bh*.06);
      g.fillRect(x+bw*.3, top-bh*.11, bw*.4, bh*.05);
      g.fillRect(x+bw/2-1.5, top-bh*.2, 3, bh*.1);
    }
    if(opts.outline){ g.strokeStyle = '#111'; g.lineWidth = 3; g.strokeRect(x, top, bw, bh+4); }
    if(opts.win){
      for(let wy = top+8; wy < H-6; wy += opts.win.gy) for(let wx = x+5; wx < x+bw-6; wx += opts.win.gx)
        if(R() < opts.win.p){ g.fillStyle = opts.win.col(); g.fillRect(wx, wy, opts.win.w, opts.win.h); }
    }
    x += bw + rr(0, opts.gap||4);
  }
}

const SCENES = {
  /* ---------------- SAKURA NIGHT ---------------- */
  sakura: {
    build(b, f, W, H){
      const sky = b.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#0d0627'); sky.addColorStop(.45,'#2b1458'); sky.addColorStop(.75,'#7a2f7e'); sky.addColorStop(1,'#ff8db8');
      b.fillStyle = sky; b.fillRect(0,0,W,H);
      const mx=W*.22, my=H*.22, mr=Math.min(W,H)*.09;
      const halo=b.createRadialGradient(mx,my,mr*.8,mx,my,mr*4); halo.addColorStop(0,'rgba(255,220,240,.35)'); halo.addColorStop(1,'rgba(255,220,240,0)');
      b.fillStyle=halo; b.fillRect(0,0,W,H);
      const moon=b.createRadialGradient(mx-mr*.3,my-mr*.3,0,mx,my,mr); moon.addColorStop(0,'#fffaf3'); moon.addColorStop(1,'#ffd9ea');
      b.fillStyle=moon; b.beginPath(); b.arc(mx,my,mr,0,TAU); b.fill();
      b.fillStyle='rgba(230,170,210,.35)';
      [[.3,.2,.18],[-.25,.35,.12],[.1,-.35,.1]].forEach(([a,c,r])=>{b.beginPath();b.arc(mx+a*mr,my+c*mr,r*mr,0,TAU);b.fill();});
      for(let i=0;i<7;i++){ const cx=R()*W, cy=H*rr(.35,.65), cw=rr(150,400);
        const cg=b.createRadialGradient(cx,cy,0,cx,cy,cw); cg.addColorStop(0,'rgba(255,170,210,.16)'); cg.addColorStop(1,'rgba(255,170,210,0)');
        b.fillStyle=cg; b.beginPath(); b.ellipse(cx,cy,cw,cw*.25,0,0,TAU); b.fill(); }
      hills(f,W,H,H*.78,40,'#4a1f5e',1); hills(f,W,H,H*.85,28,'#2c1240',3);
      const tx=W*.72, ty=H*.86, ts=Math.min(W,H)*.12; f.fillStyle='#1a0a28';
      f.fillRect(tx-ts*.48,ty-ts*.82,ts*.96,ts*.07);
      f.fillRect(tx-ts*.4,ty-ts*.98,ts*.08,ts*1.1); f.fillRect(tx+ts*.32,ty-ts*.98,ts*.08,ts*1.1);
      f.beginPath(); f.moveTo(tx-ts*.62,ty-ts*1.1); f.quadraticCurveTo(tx,ty-ts*1.0,tx+ts*.62,ty-ts*1.1); f.lineTo(tx+ts*.6,ty-ts*.98); f.quadraticCurveTo(tx,ty-ts*.92,tx-ts*.6,ty-ts*.98); f.fill();
      hills(f,W,H,H*.93,14,'#12061c',5);
      f.strokeStyle='#12061c';
      tree(f, W*.06, H, -Math.PI/2+.25, Math.min(W,H)*.16, 14, 0, (x,y)=>{
        f.fillStyle=`rgba(255,${150+R()*60|0},${200+R()*40|0},.78)`; f.beginPath(); f.arc(x,y,rr(6,16),0,TAU); f.fill(); });
      return { stars: starsArr(W,H,.65,W*H/5000|0), shoot: [], petals: [] };
    },
    mid(c, W, H, t, s){
      drawStars(c, s.stars, t, '#fff0fa');
      if(R() < .006) s.shoot.push({x:rr(W*.2,W), y:R()*H*.3, l:1});
      s.shoot = s.shoot.filter(o=>o.l>0);
      for(const o of s.shoot){ const g=c.createLinearGradient(o.x,o.y,o.x+90,o.y-40); g.addColorStop(0,`rgba(255,255,255,${o.l})`); g.addColorStop(1,'rgba(255,200,230,0)');
        c.strokeStyle=g; c.lineWidth=2; c.beginPath(); c.moveTo(o.x,o.y); c.lineTo(o.x+90,o.y-40); c.stroke(); o.x-=9; o.y+=4; o.l-=.025; }
    },
    top(c, W, H, t, s){
      if(s.petals.length < 45 && R() < .25) s.petals.push({x:R()*W*1.2, y:-10, vx:rr(-1.2,-.2), vy:rr(.6,1.5), r:R()*TAU, vr:rr(-.05,.05), z:rr(.6,1.4), w:R()*TAU});
      for(const p of s.petals){
        p.w += .03; p.x += p.vx + Math.sin(p.w)*.6; p.y += p.vy; p.r += p.vr;
        c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.scale(p.z, p.z*Math.abs(Math.cos(p.w))+.2);
        c.fillStyle = '#ffb3d4'; c.beginPath(); c.ellipse(0,0,6,4,0,0,TAU); c.fill();
        c.fillStyle = '#ffe1ee'; c.beginPath(); c.ellipse(-1.5,-1,2.5,1.5,0,0,TAU); c.fill(); c.restore();
      }
      s.petals = s.petals.filter(p => p.y < H+20);
    },
  },

  /* ---------------- JADE PALACE (Apothecary Diaries) ---------------- */
  apothecary: {
    build(b, f, W, H){
      const sky=b.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#120a1e'); sky.addColorStop(.4,'#3a1430'); sky.addColorStop(.7,'#8a3a3c'); sky.addColorStop(.9,'#e39a55'); sky.addColorStop(1,'#f3c77a');
      b.fillStyle=sky; b.fillRect(0,0,W,H);
      const mx=W*.78, my=H*.2, mr=Math.min(W,H)*.075;
      const halo=b.createRadialGradient(mx,my,mr,mx,my,mr*4); halo.addColorStop(0,'rgba(255,225,170,.3)'); halo.addColorStop(1,'rgba(255,225,170,0)');
      b.fillStyle=halo; b.fillRect(0,0,W,H);
      b.fillStyle='#ffe9c2'; b.beginPath(); b.arc(mx,my,mr,0,TAU); b.fill();
      // distant mountains (ink-wash)
      hills(b,W,H,H*.66,45,'rgba(90,30,50,.55)',7); hills(b,W,H,H*.72,30,'rgba(60,18,36,.7)',2);
      // palace roofs with curved eaves
      const roof=(g,cx,base,w,h,col)=>{ g.fillStyle=col;
        g.beginPath(); g.moveTo(cx-w*.62,base-h*.05); g.quadraticCurveTo(cx-w*.45,base-h*.02,cx-w*.38,base-h*.35);
        g.lineTo(cx-w*.12,base-h); g.lineTo(cx+w*.12,base-h); g.lineTo(cx+w*.38,base-h*.35);
        g.quadraticCurveTo(cx+w*.45,base-h*.02,cx+w*.62,base-h*.05); g.lineTo(cx+w*.5,base); g.lineTo(cx-w*.5,base); g.fill(); };
      const hall=(g,cx,base,w,h,col,lit)=>{ g.fillStyle=col; g.fillRect(cx-w*.42,base,w*.84,h*.9);
        roof(g,cx,base,w,h*.45,col);
        if(lit){ g.fillStyle='rgba(255,190,110,.75)'; for(let k=-2;k<=2;k++) g.fillRect(cx+k*w*.14-4,base+h*.25,8,h*.3); g.fillStyle=col; } };
      // pagoda
      const px=W*.12, pb=H*.82, pw=Math.min(W,H)*.16;
      for(let k=0;k<5;k++){ const w=pw*(1-k*.14), base=pb-k*pw*.38; f.fillStyle='#1c0812'; f.fillRect(px-w*.3,base-pw*.12,w*.6,pw*.4); roof(f,px,base-pw*.12,w,pw*.22,'#1c0812'); }
      f.fillRect(px-2,pb-5*pw*.38-pw*.3,4,pw*.3);
      hall(f,W*.5,H*.8,Math.min(W,H)*.5,Math.min(W,H)*.16,'#22091a',true);
      hall(f,W*.82,H*.84,Math.min(W,H)*.35,Math.min(W,H)*.12,'#1a0713',true);
      // palace wall
      f.fillStyle='#14050e'; f.fillRect(0,H*.88,W,H*.12);
      f.fillStyle='#2a0c18'; for(let x=0;x<W;x+=26) f.fillRect(x,H*.875,20,8);
      // plum branch, top-left
      f.strokeStyle='#1a0610';
      tree(f, -10, H*.06, .25, Math.min(W,H)*.13, 7, 2, (x,y)=>{ f.fillStyle=R()<.7?'rgba(255,170,190,.85)':'rgba(255,240,245,.9)'; f.beginPath(); f.arc(x,y,rr(3,7),0,TAU); f.fill(); });
      return { stars: starsArr(W,H,.35,W*H/14000|0), lanterns: [], leaves: [] };
    },
    mid(c, W, H, t, s){
      drawStars(c, s.stars, t, '#fff1d6');
    },
    top(c, W, H, t, s){
      if(s.lanterns.length < 26 && R() < .05) s.lanterns.push({x:R()*W, y:H+30, v:rr(.35,.9), z:rr(.5,1.3), p:R()*TAU});
      for(const l of s.lanterns){ l.y -= l.v*l.z; l.p += .02; const x = l.x + Math.sin(l.p)*12, w=14*l.z, h=18*l.z, fl=.85+.15*Math.sin(t*8+l.p);
        const g=c.createRadialGradient(x,l.y,0,x,l.y,w*3); g.addColorStop(0,`rgba(255,170,80,${.35*fl})`); g.addColorStop(1,'rgba(255,170,80,0)');
        c.fillStyle=g; c.beginPath(); c.arc(x,l.y,w*3,0,TAU); c.fill();
        const lg=c.createLinearGradient(x,l.y-h/2,x,l.y+h/2); lg.addColorStop(0,'#ffcf7a'); lg.addColorStop(1,'#e8582f');
        c.fillStyle=lg; c.beginPath(); c.moveTo(x-w*.4,l.y-h/2); c.lineTo(x+w*.4,l.y-h/2); c.lineTo(x+w/2,l.y+h/2); c.lineTo(x-w/2,l.y+h/2); c.fill();
        c.fillStyle=`rgba(255,245,200,${fl})`; c.fillRect(x-w*.15,l.y+h*.2,w*.3,h*.25); }
      s.lanterns = s.lanterns.filter(l => l.y > -40);
      if(s.leaves.length < 22 && R() < .12) s.leaves.push({x:R()*W, y:-10, vx:rr(.2,1), vy:rr(.5,1.2), r:R()*TAU, w:R()*TAU, pink:R()<.6});
      for(const p of s.leaves){ p.w += .04; p.x += p.vx + Math.sin(p.w)*.5; p.y += p.vy; p.r += .03;

  /* ---------------- WIZARDING NIGHT (Harry Potter) ---------------- */
  wizard: {
    build(b, f, W, H){

function drawDragon(c, x, y, s, flap, dir){
  c.save(); c.translate(x, y); c.scale(dir*s, s); c.fillStyle = '#060208';
  c.beginPath(); c.ellipse(0, 0, 34, 10, -.08, 0, TAU); c.fill();                       // body
  c.beginPath(); c.moveTo(28,-4); c.quadraticCurveTo(48,-22,62,-18); c.lineTo(70,-16); c.lineTo(62,-11); c.quadraticCurveTo(50,-10,32,4); c.fill(); // neck+head
  c.beginPath(); c.moveTo(66,-19); c.lineTo(60,-27); c.lineTo(62,-18); c.fill();           // horn
  c.beginPath(); c.moveTo(-30,0); c.quadraticCurveTo(-60,10,-84,-4); c.lineTo(-92,-2); c.lineTo(-84,2); c.quadraticCurveTo(-58,16,-28,6); c.fill(); // tail
  const wy = -flap*42;
  c.beginPath(); c.moveTo(-4,-6); c.lineTo(10,-6); c.lineTo(-6, wy-40);
  c.quadraticCurveTo(-22, wy-14, -40, wy-24); c.quadraticCurveTo(-30, wy, -46, wy-6); c.quadraticCurveTo(-26, -4, -4, -6); c.fill(); // wing
  c.restore();
}

/* ---------- scene engine ---------- */
const cv = $('bgCanvas'), ctx = cv.getContext('2d');
let sceneBuilt, W, H, back, front, sceneState, dpr = Math.min(devicePixelRatio||1, 2), useCanvas = true;
function layer(){ const l=document.createElement('canvas'); l.width=W*dpr; l.height=H*dpr; const g=l.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); return [l,g]; }
function buildScene(){
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  let bg, fg; [back,bg] = layer(); [front,fg] = layer();
  sceneBuilt = sceneOf(themeKey); sceneState = SCENES[sceneBuilt].build(bg, fg, W, H);
}
function loop(time){
  if(window.SITEF && skipFrame(time)){ requestAnimationFrame(loop); return; }
  if(useCanvas && sceneState){
    const t = time/1000, S = SCENES[sceneBuilt];
    ctx.drawImage(back,0,0,W,H); S.mid(ctx,W,H,t,sceneState);
    ctx.drawImage(front,0,0,W,H); S.top(ctx,W,H,t,sceneState);
  }
  drawFX(time/1000);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { if(useCanvas) buildScene(); });

/* =====================================================================
   THEME EDITS — made with the ✏️ editor (#owner) and saved in site.json
   (themeEdits = changes per theme, customThemes = your own copies)
   ===================================================================== */
const BASE_T = JSON.parse(JSON.stringify(THEMES));
const BASE_C = JSON.parse(JSON.stringify(CONFIG.themes));
let EDITS = {}, CUSTOM = {};
const PREVIEW = {};                                   // just-uploaded files, shown before GitHub publishes them
const asset = p => (p && PREVIEW[p]) || p;
const T_FIELDS = ['label','tab','accent','accent2','text','muted','card','line','icon','title','grad','orn','anim','splash','splashSub','subtitle','bios','sparks'];
const C_FIELDS = ['character','side','ornament','cursor','cursorHotspot','background','logo'];
const baseOf = k => (CUSTOM[k] && CUSTOM[k].base) || k;
function sceneOf(k){ const s = (EDITS[k] || {}).scene || baseOf(k); return SCENES[s] ? s : Object.keys(SCENES)[0]; }
function rebuildTheme(k){
  const b = baseOf(k), e = EDITS[k] || {};
  if(!BASE_T[b]) return false;
  const t = { ...BASE_T[b] };
  if(CUSTOM[k]) t.label = CUSTOM[k].label || t.label;
  for(const f of T_FIELDS) if(f in e && !(Array.isArray(e[f]) && !e[f].length)) t[f] = e[f];
  THEMES[k] = t;
  const c = { side: 'right', ...(BASE_C[b] || {}) };
  for(const f of C_FIELDS) if(f in e) c[f] = e[f];
  CONFIG.themes[k] = c;
  if(CUSTOM[k] && typeof CURSORS !== 'undefined' && !CURSORS[k] && CURSORS[b]) CURSORS[k] = CURSORS[b];
  return true;
}
function loadEdits(d){
  EDITS = d.themeEdits || {}; CUSTOM = d.customThemes || {};
  for(const k of new Set([...Object.keys(CUSTOM), ...Object.keys(EDITS)])) rebuildTheme(k);
  buildThemeMenu();
}
const _fonts = new Set();
function loadFont(css){
  const m = /'([^']+)'/.exec(css || ''); if(!m || _fonts.has(m[1])) return; _fonts.add(m[1]);
  if(document.querySelector(`link[href*="${m[1].replace(/ /g,'+')}"]`)) return;
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=${m[1].replace(/ /g,'+')}&display=swap`; document.head.appendChild(l);
}
// the bits of a theme that don't need the whole page redrawn
function applyExtras(key){
  const e = EDITS[key] || {}, ch = $('chara');

(function charMouse(time){
  const ed = EDITS[themeKey] || {}, ch = $('chara'), m = ed.charMouse;
  if(ch && m && mX > -999 && !document.body.classList.contains('dragChar')){
    const r = ch.getBoundingClientRect(), cx = r.left + r.width/2 - (ch._ox || 0), cy = r.top + r.height/2 - (ch._oy || 0);
    const dx = Math.max(-1, Math.min(1, (mX - cx) / (innerWidth/2))), dy = Math.max(-1, Math.min(1, (mY - cy) / (innerHeight/2)));
    const near = Math.max(0, 1 - Math.hypot(mX - cx, mY - cy) / (Math.min(innerWidth, innerHeight) * .6));

    if(m === 'spring'){ ch._vx = ((ch._vx || 0) + (dx - (ch._mx || 0)) * .02) * .9; ch._mx = (ch._mx || 0) + ch._vx; ch._my = 0; }
    else { ch._mx = (ch._mx || 0) + (dx - (ch._mx || 0))*sp; ch._my = (ch._my || 0) + (dy - (ch._my || 0))*sp; }

      case 'away':  rot = `${Y.toFixed(3)} ${(-X).toFixed(3)} 0 ${(Math.hypot(X, Y)*14).toFixed(2)}deg`; break;
      case 'lean':  rot = (X*7).toFixed(2) + 'deg'; break;
      case 'spring': rot = (X*10).toFixed(2) + 'deg'; break;
      case 'depth': tx = -X*22; ty = -Y*12; break;

      case 'follow': tx = X * innerWidth * .12; ty = Y * 20; rot = (X*4).toFixed(2) + 'deg'; break;

const devKey = () => { try{ return localStorage.getItem('ghToken') || ''; }catch(e){ return ''; } };
async function gh(path, opts = {}){
  if(window._authReady && getSess()){ const lr = await ghViaLogin(path, opts); if(lr) return lr; }
  // GET requests get a unique URL so the browser never reuses an old copy. (No cache:'no-store' — GitHub rejects its headers.)
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.dir || ''}${path}` + (opts.method ? '' : `${path.includes('?') ? '&' : '?'}_=${Date.now()}`);
  const r = await fetch(url, { ...opts,
    headers: { Authorization: `Bearer ${devKey()}`, Accept: 'application/vnd.github+json', ...(opts.body ? {'Content-Type':'application/json'} : {}) } });
  if(!r.ok && r.status !== 404){ let m = r.status; try{ m = (await r.json()).message; }catch(e){} throw new Error(m); }
  return r;
}
const textB64 = str => btoa(unescape(encodeURIComponent(str)));

let _siteQueue = Promise.resolve();
function saveSite(change){
  const job = _siteQueue.then(async () => {
    for(let attempt = 1; ; attempt++){
      const { data, sha } = await getSite(); change(data);
      try{
        await gh('site.json', { method:'PUT', body: JSON.stringify({ message:'Update site.json', content: textB64(JSON.stringify(data, null, 2)), branch: GH.branch, ...(sha ? {sha} : {}) }) });
        return data;

        await new Promise(r => setTimeout(r, 1200 * attempt));

}

    const cvs = document.createElement('canvas'); cvs.width = kind === 'cursor' ? 32 : w; cvs.height = kind === 'cursor' ? 32 : h;

          <label class="ef"><span>Theme change sound</span><span class="pair"><select data-s="sounds.theme">${sndOpts(SS.theme || 'whoosh')}</select><button class="wbtn" data-sndprev="theme" style="width:auto;margin:0">▶</button></span></label>
          ${up('sndTheme','Use my own theme sound','audio/*')}
          <label class="ef"><span>Volume</span><input type="range" data-s="sounds.vol" min=".05" max="1" step=".05" value="${SS.vol ?? .5}"></label>
          <p>The 🔇 button on the page also silences these.</p>` : ''}
        <hr><b>🔋 Battery saver</b>`); };

    // ---- inputs for links / about / sounds ----
    $('epBody').addEventListener('input', e => {
      const el = e.target;
      if(el.dataset.lk != null){ const l = linksW()[+el.dataset.lk], p = el.dataset.lp;
        if(p === 'colorMode'){ l.color = el.value === 'custom' ? (l.color && l.color[0] === '#' ? l.color : '#ffffff') : el.value; if(!l.color) delete l.color; lkSet(); render(); return; }
        if(p === 'tint'){ l.icon.tint = el.checked; lkSet(); render(); return; }
        l[p] = el.value; if(p === 'label' && !el.value) delete l.label; lkSet(); return; }
      if(el.dataset.ab != null){ const c = (SW.about || [])[+el.dataset.ab]; c[el.dataset.abp] = el.value; siteChanged(); return; }
    });
    // number-ish site values + link colour mode
    const _onIn = (el) => { if(['trail.on','viz.on','trail.kind','viz.style','viz.colors','viz.pulse','splashFx.parts'].includes(el.dataset.f)) setTimeout(render, 30);
      if(el.dataset.s === 'linkStyle.colorMode'){ SW.linkStyle = SW.linkStyle || {}; SW.linkStyle.color = el.value === 'custom' ? '#ffffff' : el.value; delete SW.linkStyle.colorMode; siteChanged(); render(); }
      if(['sounds.vol','viz.height','entry.speed','linkStyle.size','linkStyle.gap'].includes(el.dataset.s)){ const path = el.dataset.s.split('.'); SW[path[0]][path[1]] = +el.value; } };
    $('epBody').addEventListener('change', e => _onIn(e.target));
    $('epBody').addEventListener('click', async e => {
      const b = e.target.closest('button'); if(!b) return;
      const L = tab === 'links' ? linksW() : null;
      if(b.id === 'lkAdd'){ L.push({ id: 'l' + Date.now().toString(36), title: '', url: '', icon: { t: 'b', k: 'discord' } }); pickFor = L.length - 1; lkSet(); render(); return; }
      if(b.dataset.lkic != null){ pickFor = pickFor === +b.dataset.lkic ? null : +b.dataset.lkic; render(); return; }
      if(b.dataset.lkdel != null){ L.splice(+b.dataset.lkdel, 1); pickFor = null; lkSet(); render(); return; }
      if(b.dataset.lkmv){ const [i, d] = b.dataset.lkmv.split(':').map(Number), j = i + d; if(j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; pickFor = null; lkSet(); render(); return; }
      if(b.id === 'lkGo'){ try{ await siSearch($('lkSearch').value); }catch(err){ st('Couldn\'t load the icon library: ' + err.message); } const q = $('lkSearch').value; render(); const s = $('lkSearch'); if(s){ s.value = q; } if(!siResults.length) st('No icons found — try another word, or use your own picture.'); return; }
      if(b.id === 'lkPickClose'){ pickFor = null; render(); return; }
      if(b.dataset.si){ const l = L[pickFor]; try{ st('Getting icon…'); const d = await siPath(b.dataset.si);
          l.icon = { t: 'si', slug: b.dataset.si, hex: b.dataset.hex, d }; if(!l.title) l.title = b.dataset.title; pickFor = null; st(''); lkSet(); render(); }catch(err){ st('Couldn\'t get that icon: ' + err.message); } return; }
      if(b.dataset.myapp != null){ const l = L[pickFor], a = MY_APPS[+b.dataset.myapp]; l.icon = JSON.parse(JSON.stringify(a.icon)); if(!l.title) l.title = a.title; if(!l.url) l.url = a.url; pickFor = null; lkSet(); render(); return; }
      if(b.dataset.bi){ const l = L[pickFor]; l.icon = { t: 'b', k: b.dataset.bi }; if(!l.title) l.title = b.dataset.bi; pickFor = null; lkSet(); render(); return; }
      if(b.id === 'lkReset'){ if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Click again to reset your links'; return; } delete SW.links; delete SW.linkStyle; pickFor = null; siteChanged(); render(); return; }
      if(b.id === 'abAdd'){ (SW.about = SW.about || []).push({ emoji: '🎮', title: 'Currently playing', text: '' }); siteChanged(); render(); return; }
      if(b.dataset.abdel != null){ SW.about.splice(+b.dataset.abdel, 1); siteChanged(); render(); return; }
      if(b.dataset.abmv){ const A = SW.about, [i, d] = b.dataset.abmv.split(':').map(Number), j = i + d; if(j < 0 || j >= A.length) return; [A[i], A[j]] = [A[j], A[i]]; siteChanged(); render(); return; }
      if(b.dataset.sndprev){ const S = SW.sounds || {}; const was = SITE.sounds; SITE.sounds = { ...S, on: true }; playSnd(b.dataset.sndprev === 'click' ? (S.click || 'pop') : (S.theme || 'whoosh')); SITE.sounds = was; return; }
      if(b.id === 'spPrev'){ applySplash(themeKey); previewSplash(); return; }
      if(b.id === 'entPrev'){ SITE = SW; playEntry(); return; }
      if(b.dataset.pe){ const [kind, i] = b.dataset.pe.split(':'); openPE(kind, kind === 'deco' ? selDeco : +i); return; }
    });
    // drag to reorder links
    let dragI = null;
    $('epBody').addEventListener('dragstart', e => { const r = e.target.closest('.lkRow'); if(r){ dragI = +r.dataset.lki; e.dataTransfer.effectAllowed = 'move'; } });
    $('epBody').addEventListener('dragover', e => { if(dragI != null && e.target.closest('.lkRow')) e.preventDefault(); });
    $('epBody').addEventListener('drop', e => { const r = e.target.closest('.lkRow'); if(dragI == null || !r) return; e.preventDefault();
      const L = linksW(), to = +r.dataset.lki, [it] = L.splice(dragI, 1); L.splice(to, 0, it); dragI = null; pickFor = null; lkSet(); render(); });
    $('epBody').addEventListener('keydown', e => { if(e.target.id === 'lkSearch' && e.key === 'Enter'){ e.preventDefault(); $('lkGo').click(); } });
    // uploads for link icons + sounds (hooked into the existing uploader)
    window._plusUpload = (kind, path) => {
      if(kind === 'lkicon'){ const L = linksW(), i = pickFor >= 0 ? pickFor : L.length - 1; if(L[i]){ L[i].icon = { t: 'img', src: path, tint: true }; } pickFor = null; lkSet(); setTimeout(render, 50); return true; }
      if(kind === 'sndClick' || kind === 'sndTheme'){ SW.sounds = SW.sounds || {}; SW.sounds[kind === 'sndClick' ? 'click' : 'theme'] = path; siteChanged(); setTimeout(render, 50); return true; }
      return false;
    };

    /* ---------- photo editor ---------- */
    let PE = null;
    function peBox(){ let b = $('peBox'); if(!b){ b = document.createElement('div'); b.id = 'peBox'; document.body.appendChild(b);
      b.addEventListener('click', e => e.stopPropagation()); b.addEventListener('pointerdown', e => e.stopPropagation()); } return b; }
    async function openPE(kind, i){
      const path = kind === 'deco' ? ((W.decos || [])[i] || {}).v : [].concat((CONFIG.themes[themeKey] || {}).character || [])[i];
      if(!path) return;
      const img = new Image(); img.crossOrigin = 'anonymous'; img.src = asset(path);
      try{ await img.decode(); }catch(e){ return st('Couldn\'t open that picture.'); }
      PE = { kind, i, path, img, crop: { l: 0, r: 0, t: 0, b: 0 }, adj: { bright: 100, contrast: 100, sat: 100, hue: 0 }, outline: 0, outlineCol: '#ffffff', erase: [], tol: 28, tapMode: false };
      const b = peBox(); b.classList.add('open');
      b.innerHTML = `<div class="peIn"><b>✂️ Edit picture</b><canvas id="peCv"></canvas>
        <p class="peHint" id="peHint">Changes save as a new copy — the original stays.</p>
        <details open><summary>Crop</summary>${['l','r','t','b'].map(k => `<label class="ef"><span>${{ l:'Left', r:'Right', t:'Top', b:'Bottom' }[k]}</span><input type="range" data-pc="${k}" min="0" max="45" step="1" value="0"></label>`).join('')}</details>
        <details><summary>Remove background</summary><p>Works best when the background is one plain color.</p>
          <div class="pair"><button class="wbtn" id="peAuto">🪄 Remove it automatically</button><button class="wbtn" id="peTap">👆 Tap a color to erase</button></div>
          <label class="ef"><span>How strong</span><input type="range" id="peTol" min="5" max="90" step="1" value="28"></label>
          <button class="wbtn" id="peUndoBg">↩ Undo background changes</button></details>
        <details><summary>Colors</summary>
          ${[['bright','Brightness',30,170],['contrast','Contrast',30,170],['sat','Saturation',0,200],['hue','Hue',-180,180]].map(([k,l,a,z]) => `<label class="ef"><span>${l}</span><input type="range" data-pa="${k}" min="${a}" max="${z}" step="1" value="${PE.adj[k]}"></label>`).join('')}</details>
        <details><summary>Outline</summary><label class="ef"><span>Thickness</span><input type="range" id="peOl" min="0" max="20" step="1" value="0"></label>
          <label class="ef"><span>Color</span><input type="color" id="peOc" value="#ffffff"></label><p>For a glow, use Look → Character glow (or the decoration's Glow).</p></details>
        <div class="pair" style="margin-top:10px"><button class="wbtn" id="peCancel">Cancel</button><button class="wbtn go" id="peSave">💾 Save picture</button></div></div>`;
      b.querySelectorAll('input').forEach(el => el.addEventListener('input', peInput));
      $('peAuto').onclick = () => { PE.erase.push({ auto: true, tol: PE.tol }); peDraw(); };
      $('peTap').onclick = () => { PE.tapMode = !PE.tapMode; $('peTap').classList.toggle('go', PE.tapMode); $('peHint').textContent = PE.tapMode ? 'Tap the color in the picture you want gone.' : 'Changes save as a new copy — the original stays.'; };
      $('peUndoBg').onclick = () => { PE.erase = []; peDraw(); };
      $('peCv').onclick = ev => { if(!PE.tapMode) return; const r = ev.target.getBoundingClientRect(); PE.erase.push({ x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height, tol: PE.tol }); peDraw(); };
      $('peCancel').onclick = () => { b.classList.remove('open'); PE = null; };
      $('peSave').onclick = peSave;
      peDraw();
    }
    function peInput(e){ const el = e.target;
      if(el.dataset.pc) PE.crop[el.dataset.pc] = +el.value; else if(el.dataset.pa) PE.adj[el.dataset.pa] = +el.value;
      else if(el.id === 'peTol') PE.tol = +el.value; else if(el.id === 'peOl') PE.outline = +el.value; else if(el.id === 'peOc') PE.outlineCol = el.value;
      clearTimeout(peInput.h); peInput.h = setTimeout(peDraw, 40); }
    // the whole edit pipeline; scale < 1 makes a quick preview
    function peRender(scale){
      const im = PE.img, c = PE.crop, sx = im.naturalWidth * c.l/100, sy = im.naturalHeight * c.t/100;
      const sw = Math.max(1, im.naturalWidth * (1 - (c.l + c.r)/100)), sh = Math.max(1, im.naturalHeight * (1 - (c.t + c.b)/100));
      const w = Math.max(1, Math.round(sw*scale)), h = Math.max(1, Math.round(sh*scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d', { willReadFrequently: true });
      x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      const id = x.getImageData(0, 0, w, h), d = id.data;
      for(const op of PE.erase) floodErase(d, w, h, op);
      adjust(d, PE.adj);
      x.putImageData(id, 0, 0);
      const o = Math.round(PE.outline * scale * (Math.max(im.naturalWidth, im.naturalHeight) / 800));
      if(!o) return cv;
      const out = document.createElement('canvas'); out.width = w + o*2; out.height = h + o*2; const ox = out.getContext('2d');
      const sil = document.createElement('canvas'); sil.width = w; sil.height = h; const sx2 = sil.getContext('2d');
      sx2.drawImage(cv, 0, 0); sx2.globalCompositeOperation = 'source-in'; sx2.fillStyle = PE.outlineCol; sx2.fillRect(0, 0, w, h);
      for(let a = 0; a < 24; a++){ const t = a / 24 * TAU; ox.drawImage(sil, o + Math.cos(t)*o, o + Math.sin(t)*o); }
      ox.drawImage(cv, o, o); return out;
    }
    function floodErase(d, w, h, op){
      const tol = op.tol * 3.2, seen = new Uint8Array(w*h), stack = [];
      const seeds = op.auto ? (() => { const s = []; for(let i = 0; i < w; i += Math.max(1, w/40|0)){ s.push([i,0],[i,h-1]); } for(let j = 0; j < h; j += Math.max(1, h/40|0)){ s.push([0,j],[w-1,j]); } return s; })()
        : [[Math.min(w-1, op.x*w|0), Math.min(h-1, op.y*h|0)]];
      for(const [sx, sy] of seeds){
        const k0 = (sy*w + sx)*4; if(d[k0+3] < 10) continue;
        const r0 = d[k0], g0 = d[k0+1], b0 = d[k0+2]; stack.push(sy*w + sx);
        while(stack.length){ const p = stack.pop(); if(seen[p]) continue; const k = p*4;
          if(d[k+3] > 10 && Math.abs(d[k]-r0) + Math.abs(d[k+1]-g0) + Math.abs(d[k+2]-b0) > tol) continue;
          seen[p] = 1; d[k+3] = 0; const px = p % w, py = (p / w) | 0;
          if(px > 0) stack.push(p-1); if(px < w-1) stack.push(p+1); if(py > 0) stack.push(p-w); if(py < h-1) stack.push(p+w); }
      }
    }
    function adjust(d, a){
      if(a.bright === 100 && a.contrast === 100 && a.sat === 100 && !a.hue) return;
      const br = a.bright/100, ct = a.contrast/100, s = a.sat/100, th = a.hue * Math.PI/180, cs = Math.cos(th), sn = Math.sin(th);
      // hue-rotate matrix (same as CSS), then saturation
      const H = [.213+cs*.787-sn*.213, .715-cs*.715-sn*.715, .072-cs*.072+sn*.928, .213-cs*.213+sn*.143, .715+cs*.285+sn*.140, .072-cs*.072-sn*.283, .213-cs*.213-sn*.787, .715-cs*.715+sn*.715, .072+cs*.928+sn*.072];
      for(let k = 0; k < d.length; k += 4){
        if(d[k+3] === 0) continue;
        let r = d[k], g = d[k+1], b = d[k+2];
        if(a.hue){ const r2 = H[0]*r + H[1]*g + H[2]*b, g2 = H[3]*r + H[4]*g + H[5]*b, b2 = H[6]*r + H[7]*g + H[8]*b; r = r2; g = g2; b = b2; }
        if(s !== 1){ const L = .2126*r + .7152*g + .0722*b; r = L + (r-L)*s; g = L + (g-L)*s; b = L + (b-L)*s; }
        r = ((r*br) - 128)*ct + 128; g = ((g*br) - 128)*ct + 128; b = ((b*br) - 128)*ct + 128;
        d[k] = r < 0 ? 0 : r > 255 ? 255 : r; d[k+1] = g < 0 ? 0 : g > 255 ? 255 : g; d[k+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      }
    }
    function peDraw(){ const im = PE.img, sc = Math.min(1, 520 / Math.max(im.naturalWidth, im.naturalHeight)), out = peRender(sc), cv = $('peCv');
      cv.width = out.width; cv.height = out.height; cv.getContext('2d').drawImage(out, 0, 0); }
    async function peSave(){
      if(!getTok()) return (window._authReady && showLogin(), st('Log in first (🔐).'));
      $('peSave').disabled = true; $('peHint').textContent = 'Saving…';
      try{
        const out = peRender(1), blob = await new Promise(r => out.toBlob(r, 'image/webp', .9));
        const path = `${EDIT_DIR}edit-${PE.kind}-${Date.now().toString(36)}.webp`;
        PREVIEW[path] = URL.createObjectURL(blob);
        await gh(path, { method:'PUT', body: JSON.stringify({ message:'Add edited picture', content: await fileB64(blob), branch: GH.branch }) });
        if(PE.kind === 'deco'){ W.decos[PE.i].v = path; }
        else { const list = [].concat((CONFIG.themes[themeKey] || {}).character || []); list[PE.i] = path; W.character = list; }
        changed(); setTimeout(render, 220); peBox().classList.remove('open'); PE = null;
        st('✓ Picture edited. Press 💾 Save to make it live.');
      }catch(err){ $('peHint').textContent = 'Save failed: ' + err.message; $('peSave').disabled = false; }
    }
    window._peOpen = openPE;
  }

  /* ---------- open / close / save / undo ---------- */
  if(window.SITEF && !document.querySelector('#editPanel .epTabs [data-tab=site]')){ const tb = document.createElement('button'); tb.dataset.tab = 'site'; tb.textContent = 'Site'; document.querySelector('#editPanel .epTabs').appendChild(tb); }
  $('editBtn').style.display = 'grid';
  $('editBtn').onclick = e => { e.stopPropagation(); $('themeMenu').classList.remove('open'); if(hasMusic) $('musicPanel').classList.remove('open');
    if($('editPanel').classList.toggle('open')) openEditor(); else document.body.classList.remove('dragChar', 'decoEdit'); };
  $('editPanel').addEventListener('click', e => e.stopPropagation());
  $('editPanel').addEventListener('pointerdown', e => e.stopPropagation());
  $('epClose').onclick = () => { $('editPanel').classList.remove('open'); dragOn = false; document.body.classList.remove('dragChar', 'decoEdit'); };
  document.querySelector('#editPanel .epTabs').onclick = e => { const b = e.target.closest('button'); if(!b) return; tab = b.dataset.tab; render(); };
  $('epUndo').onclick = () => { const k = themeKey;
    if(lastSaved[k]) EDITS[k] = JSON.parse(JSON.stringify(lastSaved[k])); else delete EDITS[k];
    W = JSON.parse(JSON.stringify(EDITS[k] || {})); rebuildTheme(k); applyTheme(k); buildThemeMenu(); render(); st('Back to the last saved version.'); };
  $('epSave').onclick = async () => {
    if(!getTok()) return (window._authReady && showLogin(), st(window._authReady ? 'Log in first (🔐).' : KEYMSG));
    const k = themeKey, data = Object.keys(W).length ? JSON.parse(JSON.stringify(W)) : null;
    try{
      $('epSave').disabled = true;
      if(uploads.length){ st('Finishing uploads…'); await Promise.all(uploads); uploads = []; }
      st('Saving…');
      const siteData = siteDirty ? JSON.parse(JSON.stringify(SW)) : null;
      await saveSite(d => { if(siteData) d.site = siteData; d.themeEdits = d.themeEdits || {}; if(data) d.themeEdits[k] = data; else delete d.themeEdits[k];
        d.customThemes = { ...(d.customThemes || {}), ...CUSTOM }; });
      if(data) lastSaved[k] = data; else delete lastSaved[k]; siteDirty = false;
      st(`✓ Saved "${T.label}". Live for everyone in about a minute.`);
    }catch(err){ st('Save failed: ' + err.message); }
    finally{ $('epSave').disabled = false; }
  };
  addEventListener('beforeunload', e => { if(JSON.stringify(EDITS[themeKey] || {}) !== JSON.stringify(lastSaved[themeKey] || {})){ e.preventDefault(); e.returnValue = ''; } });
  window._edAfterLogin = () => { if($('editPanel').classList.contains('open')) render(); };
  window._edSynced = d => { if(window.SITEF && !siteDirty) SW = JSON.parse(JSON.stringify(d.site || {})); lastSaved = JSON.parse(JSON.stringify(d.themeEdits || {})); if($('editPanel').classList.contains('open')) openEditor(); };
  // switching themes from 🎨 while the editor is open edits the new one
  $('themeMenu').addEventListener('click', () => { if($('editPanel').classList.contains('open')) setTimeout(openEditor, 50); });
}
</script>
</body>
